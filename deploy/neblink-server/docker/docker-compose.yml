# NebLink Server + Caddy (auto-HTTPS) deployment.
#
# Usage:
#   1. Copy .env.example to .env and fill in the values.
#   2. Ensure DNS for neblink.nebflow.space points at this host.
#   3. docker compose up -d --build
#
# Caddy will obtain a certificate from Let's Encrypt on first start.

services:
  neblink-server:
    build:
      # Build from the repo root so the Dockerfile can COPY neblink-server/.
      context: ../../..
      dockerfile: deploy/neblink-server/docker/Dockerfile
    container_name: neblink-server
    restart: unless-stopped
    environment:
      NEBLINK_DB_PATH: /data/neblink.db
      NEBLINK_SERVER_PORT: "9090"
      NEBFLOW_JWT_SECRET: ${NEBFLOW_JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Persistent SQLite database (networks, users, refresh tokens, device creds).
      - ./data:/data
    # neblink-server stays internal; Caddy is the only thing exposed.
    expose:
      - "9090"
    networks:
      - neblink-net

  caddy:
    image: caddy:2-alpine
    container_name: neblink-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own state (certificates, ACME account). MUST be persisted so
      # certificates survive restarts and don't re-hit Let's Encrypt rate limits.
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - neblink-server
    networks:
      - neblink-net

networks:
  neblink-net:
    driver: bridge
