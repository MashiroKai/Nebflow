<!-- 设计稿 [[20261102_084500_cursor-tab-intent-suggestion-design__delegate-nebflow-18a4e786]] · 词表 [[glossary]] · 库入口 [[index]] -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图 1 · 补全请求时序</title>
<style>
  html,body{margin:0;padding:0;background:#f6f8fb}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       color:#1b2430;-webkit-font-smoothing:antialiased}
  .wrap{width:1360px;padding:0}
  svg{display:block}
  .t1{font-size:21px;font-weight:600;fill:#141c27}
  .t2{font-size:13px;fill:#5d6b7c}
  .lane{font-size:13.5px;font-weight:600;fill:#16202c}
  .laneSub{font-size:11px;fill:#6f7d8e}
  .msg{font-size:12.5px;fill:#22303f}
  .msgSmall{font-size:11.5px;fill:#3d4b5c}
  .note{font-size:11.5px;fill:#3a2c07}
  .red{font-size:12px;fill:#a4342a}
  .tick{font-size:11px;fill:#6f7d8e}
  .legend{font-size:12px;fill:#4a5866}
</style>
</head>
<body>
<div class="wrap">
<svg width="1360" height="900" viewBox="0 0 1360 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33465c"/>
    </marker>
    <marker id="arwGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d9bad"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a4342a"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#22303f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1360" height="900" fill="#f6f8fb"/>

  <!-- title -->
  <text class="t1" x="40" y="42">图 1 · 补全请求时序：上下文采集 → 模型 → 呈现 → 接受/拒绝 → 信号回收</text>
  <text class="t2" x="40" y="66">主干 = 输入框预填充（P1）；聊天任务提议（P2）复用同一条流水线，只把第 1、2 段换成「入站消息」触发源。所有时值为设计预算，非实测。</text>

  <!-- lanes -->
  <g>
    <g filter="url(#sh)">
      <rect x="45"  y="88" width="150" height="46" rx="9" fill="#ffffff" stroke="#c9d5e4"/>
      <rect x="225" y="88" width="150" height="46" rx="9" fill="#ffffff" stroke="#c9d5e4"/>
      <rect x="405" y="88" width="150" height="46" rx="9" fill="#eef4ff" stroke="#9dbdf0"/>
      <rect x="585" y="88" width="150" height="46" rx="9" fill="#ffffff" stroke="#c9d5e4"/>
      <rect x="765" y="88" width="150" height="46" rx="9" fill="#fff8e8" stroke="#e3c579"/>
      <rect x="945" y="88" width="150" height="46" rx="9" fill="#ffffff" stroke="#c9d5e4"/>
      <rect x="1125" y="88" width="150" height="46" rx="9" fill="#ffffff" stroke="#c9d5e4"/>
    </g>
    <text class="lane"    x="120" y="108" text-anchor="middle">1 · 输入面</text>
    <text class="laneSub" x="120" y="125" text-anchor="middle">composer #input</text>
    <text class="lane"    x="300" y="108" text-anchor="middle">2 · 前端闸</text>
    <text class="laneSub" x="300" y="125" text-anchor="middle">debounce / cancel</text>
    <text class="lane"    x="480" y="108" text-anchor="middle">3 · PrefillService</text>
    <text class="laneSub" x="480" y="125" text-anchor="middle">引擎侧单点（去抖后）</text>
    <text class="lane"    x="660" y="108" text-anchor="middle">4 · 上下文快照</text>
    <text class="laneSub" x="660" y="125" text-anchor="middle">指纹 / 会话级缓存</text>
    <text class="lane"    x="840" y="108" text-anchor="middle">5 · 判定模型（快档）</text>
    <text class="laneSub" x="840" y="125" text-anchor="middle">非主对话模型</text>
    <text class="lane"    x="1020" y="108" text-anchor="middle">6 · ghost 呈现</text>
    <text class="laneSub" x="1020" y="125" text-anchor="middle">内联浅色 / 可忽略</text>
    <text class="lane"    x="1200" y="108" text-anchor="middle">7 · 信号回收</text>
    <text class="laneSub" x="1200" y="125" text-anchor="middle">accept / reject 落盘</text>
  </g>

  <!-- lifelines -->
  <g stroke="#c2cede" stroke-width="1" stroke-dasharray="4 5">
    <line x1="120" y1="136" x2="120" y2="722"/>
    <line x1="300" y1="136" x2="300" y2="722"/>
    <line x1="480" y1="136" x2="480" y2="722"/>
    <line x1="660" y1="136" x2="660" y2="722"/>
    <line x1="840" y1="136" x2="840" y2="722"/>
    <line x1="1020" y1="136" x2="1020" y2="722"/>
    <line x1="1200" y1="136" x2="1200" y2="722"/>
  </g>

  <!-- 175: 停笔 -->
  <line x1="120" y1="175" x2="288" y2="175" stroke="#33465c" stroke-width="1.4" marker-end="url(#arw)"/>
  <text class="msg" x="204" y="167" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">停笔 700ms / 回合结束 / 粘贴完成</text>

  <!-- 225: WS 请求 -->
  <line x1="300" y1="228" x2="468" y2="228" stroke="#33465c" stroke-width="1.4" marker-end="url(#arw)"/>
  <text class="msg" x="384" y="220" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">WS <tspan font-family="ui-monospace,Menlo,monospace" font-size="11.5">suggestComposer</tspan> {sid, surface, draft, caret}</text>

  <!-- 275: 取上下文 -->
  <line x1="480" y1="278" x2="648" y2="278" stroke="#33465c" stroke-width="1.4" marker-end="url(#arw)"/>
  <text class="msg" x="564" y="270" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">最近 K 轮 + agent 身份 + 在飞任务</text>

  <!-- 320: 快照命中（回） -->
  <line x1="660" y1="323" x2="492" y2="323" stroke="#8d9bad" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwGray)"/>
  <text class="msgSmall" x="576" y="315" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">指纹命中 ⇒ 复用（&lt;10ms）；miss ⇒ 重建</text>

  <!-- 375: 模型调用 -->
  <line x1="480" y1="378" x2="828" y2="378" stroke="#b58417" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="msg" x="654" y="370" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">一次批量判定 + 生成（硬超时 800ms；thinking / tools / search 全关）</text>

  <!-- 420: 候选回 -->
  <line x1="840" y1="423" x2="492" y2="423" stroke="#8d9bad" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwGray)"/>
  <text class="msgSmall" x="666" y="415" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">候选 ≤1 行 / ≤48 字；无候选就返回空（不解释、不报错）</text>

  <!-- 470: 输出闸 note on lane 3 -->
  <g filter="url(#sh)">
    <rect x="392" y="452" width="176" height="46" rx="7" fill="#fff8e8" stroke="#e3c579"/>
  </g>
  <text class="note" x="480" y="470" text-anchor="middle">输出闸：含数字 / 路径 / 哈希 ⇒ 降级为</text>
  <text class="note" x="480" y="487" text-anchor="middle">结构化占位；与草稿冲突 ⇒ 丢弃</text>

  <!-- 525: 送到前端 -->
  <line x1="480" y1="528" x2="1008" y2="528" stroke="#33465c" stroke-width="1.4" marker-end="url(#arw)"/>
  <text class="msg" x="744" y="520" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">WS <tspan font-family="ui-monospace,Menlo,monospace" font-size="11.5">prefillSuggestion</tspan> {text, kind, expireMs}</text>

  <!-- 575: ghost note on lane 6 -->
  <g filter="url(#sh)">
    <rect x="932" y="558" width="176" height="46" rx="7" fill="#eef4ff" stroke="#9dbdf0"/>
  </g>
  <text class="note" x="1020" y="576" text-anchor="middle" fill="#1c3555">浅色内联 ghost，不覆盖草稿、</text>
  <text class="note" x="1020" y="593" text-anchor="middle" fill="#1c3555">不抢焦点；任意键输入即消失</text>

  <!-- 630: 接受 -->
  <line x1="120" y1="632" x2="1008" y2="632" stroke="#33465c" stroke-width="1.4" marker-end="url(#arw)"/>
  <text class="msg" x="564" y="624" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">Tab / 右滑 接受（输入法组字中一律不拦）</text>

  <!-- 678: 信号 -->
  <line x1="1020" y1="680" x2="1188" y2="680" stroke="#33465c" stroke-width="1.4" marker-end="url(#arw)"/>
  <text class="msgSmall" x="1104" y="672" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">accept / reject / expired</text>

  <!-- 718: 取消路径 -->
  <line x1="120" y1="716" x2="468" y2="716" stroke="#a4342a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwRed)"/>
  <text class="red" x="294" y="708" text-anchor="middle" style="paint-order:stroke;stroke:#f6f8fb;stroke-width:4">继续打字 ⇒ 取消在飞请求（cancel，不重试、不补偿）</text>

  <!-- latency budget -->
  <text class="t1" x="40" y="776" font-size="14">延迟预算（P1 目标：P50 ≤ 400ms，P95 ≤ 900ms；超预算 = 用户已经打完字，等于没出）</text>
  <g>
    <rect x="140" y="792" width="1080" height="26" rx="4" fill="#e7edf5"/>
    <rect x="140" y="792" width="65"  height="26" fill="#b9c8da"/>
    <rect x="205" y="792" width="16"  height="26" fill="#8fa5be"/>
    <rect x="221" y="792" width="281" height="26" fill="#e0b44a"/>
    <rect x="502" y="792" width="70"  height="26" fill="#7ea6de"/>
    <text x="172" y="809" font-size="11" fill="#22303f" text-anchor="middle">排队 60</text>
    <line x1="46" y1="805" x2="212" y2="805" stroke="#8d9bad" stroke-width="1"/>
    <text x="46" y="800" font-size="11" fill="#4a5866" text-anchor="start">快照 15ms →</text>
    <text x="361" y="809" font-size="11.5" fill="#3a2c07" text-anchor="middle">模型 260（快档，小模型）</text>
    <text x="537" y="809" font-size="11" fill="#16202c" text-anchor="middle">回程+渲染 65</text>
    <g stroke="#8d9bad" stroke-width="1">
      <line x1="140" y1="820" x2="140" y2="826"/><line x1="356" y1="820" x2="356" y2="826"/>
      <line x1="572" y1="820" x2="572" y2="826"/><line x1="788" y1="820" x2="788" y2="826"/>
      <line x1="1004" y1="820" x2="1004" y2="826"/><line x1="1220" y1="820" x2="1220" y2="826"/>
    </g>
    <text class="tick" x="140" y="840" text-anchor="middle">0</text>
    <text class="tick" x="356" y="840" text-anchor="middle">200ms</text>
    <text class="tick" x="572" y="840" text-anchor="middle">400ms（P50）</text>
    <text class="tick" x="788" y="840" text-anchor="middle">600ms</text>
    <text class="tick" x="1004" y="840" text-anchor="middle">800ms</text>
    <text class="tick" x="1220" y="840" text-anchor="middle">1000ms</text>
  </g>
  <text class="legend" x="140" y="872">对照：Cursor Tab Fusion 服务端 p50 260ms（官方 2025-01-13 公告）；Zed Zeta 目标 p50 &lt;200ms / p90 &lt;500ms。⇒ 本稿把「模型腿」压到与它们同一量级，其余预算留给本地往返与渲染。</text>
  <text class="legend" x="140" y="890">灰色段 = 本地零网络开销；黄色段 = 唯一的外部延迟来源（可换 provider，但换不掉量级）。超过 900ms 一律不出建议，静默丢弃。</text>
</svg>
</div>
</body>
</html>
