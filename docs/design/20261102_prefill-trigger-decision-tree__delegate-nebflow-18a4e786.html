  <rect x="0" y="0" width="1420" height="1010" fill="#f6f8fb"/>
  <text class="t1" x="40" y="42">图 2 · 两个场景的触发决策树：何时出、何时不出</text>
  <text class="t2" x="40" y="66">所有「不出」分支一律静默——不 toast、不报错、不写对话行。每一条「不出」都是一次成本节省，也是「不打扰」的物理保证。</text>

  <rect x="34" y="86" width="666" height="840" rx="14" fill="#ffffff" stroke="#d6e0ec"/>
  <text class="ph"    x="56" y="116">A · 输入框预填充（P1）</text>
  <text class="phSub" x="56" y="135">触发源：停笔 / 回合结束 / 粘贴完成；一秒内最多考虑一次</text>

  <text class="gate"    x="72" y="175">1 总闸 prefill.enabled</text>
  <text class="gateSub" x="72" y="194">设置页既有分区里的一把开关；关 = 零请求、零渲染、零成本</text>

  <text class="gate"    x="72" y="257">2 面闸：主会话 / ask 坞 / 三面 composer</text>
  <text class="gateSub" x="72" y="276">只在这三个输入面上出；只读面（wiki、日志、diff）一律不出</text>

  <text class="gate"    x="72" y="339">3 回合态：本会话是否正在等答复</text>
  <text class="gateSub" x="72" y="358">在等答复 ⇒ 不出（此时用户该做的是等待，不是追问）；拿不准按「在等」算</text>

  <text class="gate"    x="72" y="421">4 输入态：输入法组字中 / 光标不在末尾 / 草稿超一行</text>
  <text class="gateSub" x="72" y="440">组字中一律不拦（复用既有组字前置短路）；多行草稿说明你在写正文，不预测</text>

  <text class="gate"    x="72" y="503">5 冷却：本会话 60s 内已忽略过 2 次</text>
  <text class="gateSub" x="72" y="522">连续被忽略 ⇒ 本会话静默 5 分钟（不降频到「偶尔骚扰」）</text>

  <text class="gate"    x="72" y="585">6 去重：上下文指纹与上次请求相同</text>
  <text class="gateSub" x="72" y="604">指纹 = 会话末轮指纹 + 草稿 + 在飞任务集合；相同 ⇒ 直接复用上次结果或不出</text>

  <text class="gate"    x="72" y="667">7 预算：本会话每分钟请求数、本小时额度</text>
  <text class="gateSub" x="72" y="686">按会话分桶，超限即静默退避到下一分钟（不排队、不补偿）</text>

  <text class="gate"    x="72" y="749">8 输出闸：过了才允许上屏</text>
  <text class="gateSub" x="72" y="768">单行 ≤48 字｜含数字/路径/哈希/commit ⇒ 降级为结构化占位｜与草稿冲突 ⇒ 丢</text>

  <text class="out"    x="74" y="856">出：浅色 ghost 内联</text>
  <text class="outSub" x="74" y="875">Tab / 右滑接受；任意键即消失</text>
  <text class="outSub" x="74" y="891">30s 无操作自动过期</text>

  <text class="skip"   x="316" y="854">不出：静默丢弃</text>
  <text class="outSub" x="316" y="873" fill="#8a2f26">无候选 / 超时 / 超预算</text>
  <text class="outSub" x="316" y="889" fill="#8a2f26">一律不解释、不报错</text>

  <text class="ph"    x="742" y="116">B · 群/好友聊天的任务提议（P2）</text>
  <text class="phSub" x="742" y="135">触发源：入站消息落库后一次；只看用户可见、且用户有权处理的内容</text>

  <g filter="url(#sh2)">
    <rect x="742" y="152" width="430" height="58" rx="8" fill="#eef4ff" stroke="#9dbdf0"/>
    <rect x="742" y="234" width="430" height="58" rx="8" fill="#ffffff" stroke="#c9d5e4"/>

  <text class="gate"    x="758" y="175">1 总闸 chatProposal.enabled（按场景独立）</text>
  <text class="gateSub" x="758" y="194">与 A 各自一把开关；关掉聊天提议不影响预填充</text>

  <text class="gate"    x="758" y="257">2 面闸：好友 / 群入站消息，且不是我发的</text>
  <text class="gateSub" x="758" y="276">只吃用户可见、用户有权处理的会话；不看别人的私密上下文</text>

  <text class="gate"    x="758" y="339">3 隐私闸（硬闸，先于一切模型调用）</text>
  <text class="gateSub" x="758" y="358">会话已标静音 / 命中凭据形态（密钥、验证码、密码、证件号）⇒ 直接关提议</text>

  <text class="gate"    x="758" y="421">4 意图闸：消息里有没有可执行的事 + 执行者是谁</text>
  <text class="gateSub" x="758" y="440">要做某事／约时间／要交付物／要查资料／要建日程；寒暄、表情、纯陈述 ⇒ 不出</text>

  <text class="gate"    x="758" y="503">5 置信度闸：判定模型给出 P(可执行) 与执行者</text>
  <text class="gateSub" x="758" y="522">P ≥ 0.72 才出；执行者 = 用户 → 提议「建待办」；= Stand → 提议「派 agent」</text>

  <text class="gate"    x="758" y="585">6 去重：同会话同话题 10 分钟内已提议过</text>
  <text class="gateSub" x="758" y="604">话题键 = 会话 id + 意图指纹（动作 + 对象），不按消息 id（一条事可能连发几轮）</text>

  <text class="gate"    x="758" y="667">7 冷却与降权：同会话 5 分钟 1 次、每日 20 次</text>
  <text class="gateSub" x="758" y="686">同类提议被拒 ≥3 次 ⇒ 该类阈值上调 0.1（封顶 0.9），不再对你说第二遍</text>

  <text class="gate"    x="758" y="749">8 出口闸：只出 chips，不出弹窗</text>
  <text class="gateSub" x="758" y="768">消息下方一颗低调 chip；点了才展开确认；绝不自动建待办、绝不自动派 agent</text>

  <text class="out"    x="760" y="856">出：消息下一颗 chip</text>
  <text class="outSub" x="760" y="875">「建待办」/「派 agent」二选一</text>
  <text class="outSub" x="760" y="891">点开确认后走既有工具面</text>

  <text class="skip"   x="1002" y="854">不出：静默</text>
  <text class="outSub" x="1002" y="873" fill="#8a2f26">不弹窗、不写消息</text>
  <text class="outSub" x="1002" y="889" fill="#8a2f26">不改变会话已读态</text>

  <text class="foot" x="40" y="952">共同纪律：先闸后模型——闸在本地纯函数里判完，过不了闸的请求根本不上云端；因此「关了开关 = 零请求」是可机械断言的，不是口头承诺。</text>
  <text class="foot" x="40" y="974">两棵树的闸门序号即设计稿 §4.2 / §5.2 的验收编号：每道闸都能单独构造反例（PASS/FAIL 二值），不做「尽量」类判据。</text>
  <text class="foot" x="40" y="996">蓝色 = 总闸；红色边 = 隐私硬闸（先于模型调用，任何配置都不能绕过）；黄色 = 成本/打扰闸（可调参数）；绿色出口 = 唯一用户可见形态。</text>
