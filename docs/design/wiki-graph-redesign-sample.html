<style>
  :root {
    --color-background: #f5f6f7;
    --color-card: #ffffff;
    --color-foreground: #141416;
    --color-muted: #6f727b;
    --color-card-border: #e8e9ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background: #101112;
      --color-card: #1b1c1e;
      --color-foreground: #f2f2f4;
      --color-muted: #8f929b;
      --color-card-border: #313236;
    }
  }
  /* 评审辅助：?theme=light|dark 强制主题（默认跟随系统） */
  :root[data-theme="light"] {
    --color-background: #f5f6f7;
    --color-card: #ffffff;
    --color-foreground: #141416;
    --color-muted: #6f727b;
    --color-card-border: #e8e9ec;
  }
  :root[data-theme="dark"] {
    --color-background: #101112;
    --color-card: #1b1c1e;
    --color-foreground: #f2f2f4;
    --color-muted: #8f929b;
    --color-card-border: #313236;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--color-background);
    color: var(--color-foreground);
    font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
  #graph.grabbing { cursor: grabbing; }
  #graph.hovering { cursor: pointer; }

  /* ── 顶栏：标题 + 搜索 + 目录 chips（唯一三层控件） ── */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px 10px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  #brand .name { font-size: 15px; font-weight: 500; letter-spacing: .2px; }
  #brand .tag { font-size: 11px; color: var(--color-muted); }
  #search {
    display: flex; align-items: center; gap: 8px;
    background: var(--color-card);
    border: 1px solid var(--color-card-border);
    border-radius: 10px; padding: 6px 12px; min-width: 220px;
  }
  #search:focus-within { border-color: var(--color-muted); }
  #search svg { flex: none; color: var(--color-muted); }
  #search input {
    border: 0; outline: 0; background: transparent; color: var(--color-foreground);
    font: inherit; width: 100%;
  }
  #search input::placeholder { color: var(--color-muted); }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--color-card-border); background: var(--color-card);
    color: var(--color-muted); border-radius: 999px; padding: 4px 12px;
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .chip:hover { color: var(--color-foreground); }
  .chip.on { background: var(--color-foreground); border-color: var(--color-foreground); color: var(--color-background); }

  /* ── 悬停 tooltip ── */
  #tip {
    position: absolute; z-index: 30; display: none; max-width: 320px;
    background: var(--color-card); border: 1px solid var(--color-card-border);
    border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 8px 28px color-mix(in srgb, var(--color-foreground) 10%, transparent);
    pointer-events: none;
  }
  #tip .tt { font-weight: 500; font-size: 13px; margin-bottom: 3px; }
  #tip .ts { color: var(--color-muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #tip .td { color: var(--color-muted); font-size: 11px; margin-top: 5px; }

  /* ── 右侧预览卡（单击节点滑入） ── */
  #preview {
    position: absolute; z-index: 20; top: 64px; right: 20px; bottom: 52px; width: 300px;
    background: var(--color-card); border: 1px solid var(--color-card-border);
    border-radius: 14px; padding: 18px 18px 14px; overflow-y: auto;
    box-shadow: 0 12px 40px color-mix(in srgb, var(--color-foreground) 12%, transparent);
    transform: translateX(24px); opacity: 0; visibility: hidden;
    transition: transform .18s ease, opacity .18s ease, visibility .18s;
  }
  #preview.open { transform: none; opacity: 1; visibility: visible; }
  #preview .close {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
    border: 0; background: transparent; color: var(--color-muted); cursor: pointer;
    border-radius: 8px; font-size: 15px; line-height: 26px;
  }
  #preview .close:hover { color: var(--color-foreground); background: var(--color-background); }
  #preview h2 { margin: 2px 24px 4px 0; font-size: 15px; font-weight: 500; line-height: 1.4; }
  #preview .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  #preview .badge {
    font-size: 11px; color: var(--color-muted);
    border: 1px solid var(--color-card-border); border-radius: 999px; padding: 1px 9px;
  }
  #preview .summary { color: var(--color-muted); font-size: 12.5px; margin: 0 0 12px; }
  #preview h3 { font-size: 11px; font-weight: 500; color: var(--color-muted); letter-spacing: .8px; margin: 14px 0 6px; text-transform: uppercase; }
  #preview ul { list-style: none; margin: 0; padding: 0; }
  #preview li { margin: 3px 0; }
  #preview li.ghost { color: var(--color-muted); }
  #preview .ref {
    border: 0; background: transparent; padding: 0; font: inherit; cursor: pointer;
    color: var(--color-foreground); text-align: left; display: block; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #preview .ref:hover { text-decoration: underline; }
  #preview .path {
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--color-muted); word-break: break-all;
    background: var(--color-background); border-radius: 8px; padding: 6px 9px; margin-top: 12px;
  }
  #preview .openbtn {
    margin-top: 12px; width: 100%; padding: 8px 0;
    border: 1px solid var(--color-foreground); border-radius: 10px;
    background: var(--color-foreground); color: var(--color-background);
    font: inherit; font-weight: 500; cursor: pointer;
  }
  #preview .hint { display: none; margin-top: 8px; font-size: 11px; color: var(--color-muted); }
  #preview .hint.show { display: block; }

  /* ── 信息行（左下）与图例（右下） ── */
  #infoline {
    position: absolute; left: 20px; bottom: 16px; z-index: 10;
    color: var(--color-muted); font-size: 12px; pointer-events: none;
  }
  #infoline button {
    pointer-events: auto; border: 0; background: transparent; padding: 0;
    font: inherit; color: var(--color-muted); text-decoration: underline dotted; cursor: pointer;
  }
  #infoline button:hover { color: var(--color-foreground); }
  #legend {
    position: absolute; right: 20px; bottom: 16px; z-index: 10;
    color: var(--color-muted); font-size: 11px; text-align: right; pointer-events: none;
  }
  #preview.open ~ #legend { display: none; }

  /* ── 断链浮层 ── */
  #broken {
    position: absolute; left: 20px; bottom: 40px; z-index: 25; display: none;
    width: 380px; max-height: 260px; overflow-y: auto;
    background: var(--color-card); border: 1px solid var(--color-card-border);
    border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 8px 28px color-mix(in srgb, var(--color-foreground) 10%, transparent);
  }
  #broken.open { display: block; }
  #broken h3 { margin: 2px 0 8px; font-size: 12px; font-weight: 500; }
  #broken .row { font-size: 11.5px; color: var(--color-muted); margin: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #broken .row b { color: var(--color-foreground); font-weight: 500; }

  @media (max-width: 720px) {
    #chips { display: none; }
    #preview { left: 12px; right: 12px; width: auto; top: auto; height: 46vh; bottom: 12px; }
  }
</style>
</head>

<script>
'use strict';
(function () {
  const DATA = JSON.parse(document.getElementById('graph-data').textContent);

  // ── 画布与主题（颜色一律经 CSS 变量，canvas 用 getComputedStyle 读取） ──
  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  let C = {};
  function readColors() { C = { bg: css('--color-background'), ink: css('--color-foreground'), muted: css('--color-muted'), line: css('--color-card-border') }; }

  // ── 数据整形：去重边、目录集、索引 ──
  const byId = new Map();
  for (const n of DATA.nodes) { n.out = []; n.inc = []; byId.set(n.i, n); }
  const seenEdge = new Set();
  const edges = [];
  for (const [from, to, embed] of DATA.edges) {
    if (from === to) continue;
    const key = from + '|' + to;
    if (seenEdge.has(key)) continue;
    seenEdge.add(key);
    const a = byId.get(from), b = byId.get(to);
    if (!a || !b) continue;
    edges.push({ a, b });
    a.out.push(b); b.inc.push(a);
  }
  const dirs = [...new Set(DATA.nodes.map(n => n.d))].sort();

  // ── 确定性布局：目录聚簇初始化 + 力导向收敛（跑完即停，无常驻动画） ──
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function radiusOf(n) { return 4 + Math.min(7, Math.sqrt(n.g) * 1.9); }
  function layout() {
    const rnd = mulberry32(42);
    const dirIdx = new Map(dirs.map((d, i) => [d, i]));
    const R = Math.min(W, H) * 0.34;
    for (const n of DATA.nodes) {
      const ang = (dirIdx.get(n.d) / dirs.length) * Math.PI * 2;
      const cx = W / 2 + Math.cos(ang) * R, cy = H / 2 + Math.sin(ang) * R;
      n.x = cx + (rnd() - 0.5) * 90;
      n.y = cy + (rnd() - 0.5) * 90;
    }
    let alpha = 1;
    for (let it = 0; it < 320; it++) {
      for (let i = 0; i < DATA.nodes.length; i++) {
        const a = DATA.nodes[i];
        for (let j = i + 1; j < DATA.nodes.length; j++) {
          const b = DATA.nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = rnd() - 0.5; dy = rnd() - 0.5; d2 = 1; }
          if (d2 > 160000) continue;
          const f = 1500 * alpha / d2, d = Math.sqrt(d2);
          const fx = dx / d * f, fy = dy / d * f;
          a.x += fx; a.y += fy; b.x -= fx; b.y -= fy;
        }
      }
      for (const e of edges) {
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        const f = (d - 95) * 0.02 * alpha;
        e.a.x += dx / d * f; e.a.y += dy / d * f;
        e.b.x -= dx / d * f; e.b.y -= dy / d * f;
      }
      for (const n of DATA.nodes) {
        n.x += (W / 2 - n.x) * 0.002 * alpha;
        n.y += (H / 2 - n.y) * 0.002 * alpha;
      }
      alpha *= 0.985;
    }
  }

  // ── 视图状态 ──
  let scale = 1, panX = 0, panY = 0;
  let hoverN = null, hoverPin = false, selected = null, draggingNode = null, panning = false;
  let query = '', dirFilter = '';

  function activeFilter() {
    return function (n) {
      if (dirFilter && n.d !== dirFilter) return false;
      if (query) {
        const q = query.toLowerCase();
        if (!(n.t.toLowerCase().includes(q) || n.i.toLowerCase().includes(q))) return false;
      }
      return true;
    };
  }

  function neighborhood(n) {
    const set = new Set([n]);
    for (const m of n.out) set.add(m);
    for (const m of n.inc) set.add(m);
    return set;
  }

  // ── 绘制 ──
  function draw() {
    if (!C.ink) readColors();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2 + panX, H / 2 + panY);
    ctx.scale(scale, scale);
    ctx.translate(-W / 2, -H / 2);

    const focus = hoverN || selected;
    const near = focus ? neighborhood(focus) : null;
    const pass = activeFilter();
    const showLabels = DATA.nodes.length <= 120 || scale > 1.4;

    // 边：1px 直线；焦点邻域全亮，其余淡
    for (const e of edges) {
      const hl = near && (e.a === focus || e.b === focus);
      const dim = (!pass(e.a)) || (!pass(e.b)) || (near && !hl && !(near.has(e.a) && near.has(e.b)));
      ctx.strokeStyle = C.muted;
      ctx.globalAlpha = hl ? 0.85 : (dim ? 0.05 : 0.22);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y);
      ctx.lineTo(e.b.x, e.b.y);
      ctx.stroke();
    }

    // 节点：实心圆点，度数→半径与墨色深浅（muted→ink）；附件节点恒小、默认无标签
    for (const n of DATA.nodes) {
      const isAttach = !/\.(md|markdown|html)$/i.test(n.i);
      const r = isAttach ? 3.5 : radiusOf(n);
      const dim = !pass(n) || (near && !near.has(n));
      ctx.globalAlpha = dim ? 0.12 : 1;
      const shade = isAttach ? 0 : Math.min(1, n.g / 8);
      ctx.fillStyle = shade > 0.45 ? C.ink : C.muted;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fill();
      if (n === selected || n === hoverN) {
        ctx.strokeStyle = C.ink;
        ctx.globalAlpha = dim ? 0.2 : 0.9;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 3.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = dim ? 0.12 : 1;
      }
      if (showLabels && !dim && (!isAttach || n === hoverN || n === selected)) {
        ctx.globalAlpha = (n === hoverN) ? 1 : 0.62;
        ctx.fillStyle = C.ink;
        ctx.font = (n === hoverN ? '500 ' : '400 ') + '11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        const label = n.t.length > 22 ? n.t.slice(0, 21) + '…' : n.t;
        ctx.fillText(label, n.x, n.y + r + 13);
        ctx.globalAlpha = dim ? 0.12 : 1;
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ── tooltip ──
  const tip = document.getElementById('tip');
  function showTip(n, px, py) {
    tip.querySelector('.tt').textContent = n.t;
    tip.querySelector('.ts').textContent = n.s || '（无摘要——首段即标题或列表）';
    tip.querySelector('.td').textContent = n.d + ' · 被引 ' + n.inc.length + ' · 引出 ' + n.out.length;
    tip.style.display = 'block';
    const r = canvas.getBoundingClientRect();
    let x = px + 14, y = py + 14;
    if (x + 330 > r.width) x = px - 330;
    if (y + 90 > r.height) y = py - 90;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }

  // ── 预览卡 ──
  const preview = document.getElementById('preview');
  function refItem(n) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ref';
    b.textContent = n.t;
    b.addEventListener('click', () => select(n, true));
    li.appendChild(b);
    return li;
  }
  function ghostItem(text) {
    const li = document.createElement('li');
    li.className = 'ghost';
    li.textContent = text + '（未解析）';
    return li;
  }
  function renderPreview(n) {
    preview.querySelector('h2').textContent = n.t;
    const badges = preview.querySelector('.badges');
    badges.textContent = '';
    for (const text of [n.d === '.' ? '根目录' : n.d, n.ty, n.st]) {
      if (!text) continue;
      const s = document.createElement('span');
      s.className = 'badge';
      s.textContent = text;
      badges.appendChild(s);
    }
    preview.querySelector('.summary').textContent = n.s || '（无摘要——首段即标题或列表）';
    const toc = preview.querySelector('.toc');
    toc.textContent = '';
    for (const h of (n.h || []).slice(0, 5)) {
      const li = document.createElement('li');
      li.textContent = h;
      toc.appendChild(li);
    }
    toc.previousElementSibling.style.display = toc.children.length ? '' : 'none';
    const outL = preview.querySelector('.out');
    outL.textContent = '';
    (n.out.length ? n.out : []).slice(0, 5).forEach(m => outL.appendChild(refItem(m)));
    if (!n.out.length) outL.appendChild(ghostItem('无出链'));
    const inL = preview.querySelector('.in');
    inL.textContent = '';
    n.inc.slice(0, 5).forEach(m => inL.appendChild(refItem(m)));
    if (!n.inc.length) inL.appendChild(ghostItem('无入链（孤儿：纪律要求至少引用词表或 index）'));
    preview.querySelector('.path').textContent = 'docs/' + n.i;
  }
  function select(n, scroll) {
    selected = n;
    renderPreview(n);
    preview.classList.add('open');
    if (scroll) {
      // 把选中节点平移到视野中心（保持缩放），并向左让出预览卡宽度的一半
      panX = W / 2 - n.x * scale - 150 * scale;
      panY = H / 2 - n.y * scale;
    }
    draw();
  }
  function deselect() {
    selected = null;
    preview.classList.remove('open');
    draw();
  }
  preview.querySelector('.close').addEventListener('click', deselect);
  preview.querySelector('.openbtn').addEventListener('click', () => {
    preview.querySelector('.hint').classList.add('show');
  });

  // ── 拾取与指针交互 ──
  function toWorld(px, py) {
    return [(px - W / 2 - panX) / scale + W / 2, (py - H / 2 - panY) / scale + H / 2];
  }
  function pick(px, py) {
    const [wx, wy] = toWorld(px, py);
    let best = null, bestD = 1e9;
    for (const n of DATA.nodes) {
      const d = Math.hypot(n.x - wx, n.y - wy);
      if (d < radiusOf(n) + 5 && d < bestD) { best = n; bestD = d; }
    }
    return best;
  }
  let lastPointer = null;
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    lastPointer = [px, py];
    if (panning) { panX += e.movementX; panY += e.movementY; draw(); return; }
    if (draggingNode) {
      const [wx, wy] = toWorld(px, py);
      draggingNode.x = wx; draggingNode.y = wy;
      draw();
      return;
    }
    const n = pick(px, py);
    if (n !== hoverN) { hoverN = n; draw(); }
    canvas.classList.toggle('hovering', !!n);
    if (n) showTip(n, px, py); else hideTip();
  });
  canvas.addEventListener('pointerdown', (e) => {
    const r = canvas.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const n = pick(px, py);
    canvas.setPointerCapture(e.pointerId);
    if (n) { draggingNode = n; canvas.classList.add('grabbing'); }
    else { panning = true; canvas.classList.add('grabbing'); }
  });
  canvas.addEventListener('pointerup', (e) => {
    const wasDragging = draggingNode;
    const wasPanning = panning;
    draggingNode = null; panning = false;
    canvas.classList.remove('grabbing');
    if (wasDragging && !wasPanning) { select(wasDragging, false); return; }
    if (!wasPanning) {
      const r = canvas.getBoundingClientRect();
      const n = pick(e.clientX - r.left, e.clientY - r.top);
      if (n) select(n, false); else deselect();
    }
  });
  canvas.addEventListener('pointerleave', () => { if (!hoverPin) { hoverN = null; hideTip(); draw(); } });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const next = Math.min(3.2, Math.max(0.35, scale * factor));
    const k = next / scale;
    panX = px - (px - panX) * k;
    panY = py - (py - panY) * k;
    scale = next;
    draw();
  }, { passive: false });

  // ── 搜索 + 目录 chips ──
  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', () => { query = searchInput.value.trim(); draw(); });

  const chipsEl = document.getElementById('chips');
  function renderChips() {
    chipsEl.textContent = '';
    const mk = (label, value) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (dirFilter === value ? ' on' : '');
      b.textContent = label;
      b.addEventListener('click', () => { dirFilter = (dirFilter === value ? '' : value); renderChips(); draw(); });
      return b;
    };
    chipsEl.appendChild(mk('全部', ''));
    for (const d of dirs) chipsEl.appendChild(mk(d === '.' ? '根目录' : d + '/', d));
  }

  // ── 信息行 + 断链浮层 ──
  const infoline = document.getElementById('infoline');
  const broken = document.getElementById('broken');
  function renderInfo() {
    infoline.textContent = '';
    const span = document.createElement('span');
    span.textContent = DATA.nodes.length + ' 篇文档 · ' + DATA.edges.length + ' 条引用 · ';
    infoline.appendChild(span);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = DATA.unresolved.length + ' 条未解析引用';
    btn.addEventListener('click', () => broken.classList.toggle('open'));
    infoline.appendChild(btn);
    const rows = broken.querySelector('.rows');
    rows.textContent = '';
    for (const [from, target] of DATA.unresolved.slice(0, 40)) {
      const div = document.createElement('div');
      div.className = 'row';
      const b = document.createElement('b');
      b.textContent = from + ' → ';
      div.appendChild(b);
      div.appendChild(document.createTextNode(target));
      rows.appendChild(div);
    }
  }

  // ── 键盘 ──
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (broken.classList.contains('open')) { broken.classList.remove('open'); return; }
    if (preview.classList.contains('open')) { deselect(); return; }
    if (query) { query = ''; searchInput.value = ''; draw(); return; }
    if (dirFilter) { dirFilter = ''; renderChips(); draw(); }
  });

  // ── 主题翻转 ──
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', () => { readColors(); draw(); });

  // ── URL 参数（截图/复核用） ──
  function applyParams() {
    const p = new URLSearchParams(location.search);
    const theme = p.get('theme');
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
      readColors();
    }
    const dir = p.get('dir');
    if (dir && dirs.includes(dir)) { dirFilter = dir; }
    const rel = p.get('node');
    if (rel && byId.has(rel)) {
      const n = byId.get(rel);
      hoverN = p.get('hover') ? n : null;
      select(n, true);
      if (p.get('hover')) {
        hoverPin = true;
        const pt = [(n.x - W / 2) * scale + W / 2 + panX, (n.y - H / 2) * scale + H / 2 + panY];
        showTip(n, pt[0], pt[1]);
      }
    }
  }

  // ── 启动 ──
  readColors();
  resize();
  renderChips();
  renderInfo();
  window.addEventListener('resize', resize);
  layout();
  applyParams();
  draw();
})();
</script>
</body>
</html>
