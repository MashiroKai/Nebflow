.vt-a.th-light .mf-strip {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 72px;
  z-index: 20;
  overflow: visible;
  touch-action: pan-y;
                                                            
                                                
                                                 
                                 
  perspective: 1200px;
}
.vt-a.th-light .mf-strip-chip { pointer-events: auto; }
.vt-a.th-light .mf-strip.fade {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
}
.vt-a.th-light .mf-strip[hidden] { display: none; }
.vt-a.th-light .mf-strip-chip {
  position: absolute;
  top: 40px;
  left: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 66px;
  height: 32px;
  padding: 0 var(--mpad-x);
  border-radius: var(--ds-radius-pill);
                                                     
                                                         
                                       
  border: 0;
                                                        
                                                                    
                                                           
                                                    
                                                 
                                                             
                                             
                              
                                                              
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
                                                               
                                                               
                                               
                                                          
                                                              
                                                  
                                                                  
                                                      
                                                                      
                                                   
                                                
  color: var(--ds-text);
                                                         
                                                                  
                                                              
                               
  font-size: var(--mfs-sub);
  font-weight: 500;
  cursor: pointer;
                                                      
                                                      
                                                        
                                                
  overflow: visible;
  white-space: nowrap;
                                                             
                                            
                                              
                                                       
  touch-action: pan-y;
                                                       
                                             
                                                            
                                                         
                                                      
                                            
  transform-origin: center center;
                                                         
                                             
                                     
  transform: translate(calc(-50% + var(--rdx, 0px) + var(--sdx, 0px)), -50%) scale(var(--rsc, 1)) rotateY(var(--rrot, 0deg));
  opacity: var(--rop, 1);
  filter: blur(var(--rbl, 0px));
  transition:
    transform var(--dur-switch, 280ms) cubic-bezier(0.22, 0.61, 0.36, 1),
    opacity 220ms ease,
    filter 220ms ease,
    max-width 220ms ease;
  will-change: transform, opacity;
}
