[package]
name = "nebflow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
async-stream = { workspace = true }
regex = "1"
sha2 = "0.10"
urlencoding = "2"
lazy_static = "1"
similar = "2"
glob = "0.3"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "json_serde"
harness = false

[[bench]]
name = "sse_parse"
harness = false

[[bench]]
name = "agent_spawn"
harness = false
