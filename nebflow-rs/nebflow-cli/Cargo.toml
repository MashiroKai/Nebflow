[package]
name = "nebflow-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
nebflow-core = { path = "../nebflow-core" }
nebflow-agent = { path = "../nebflow-agent" }
nebflow-gateway = { path = "../nebflow-gateway" }
