# Brand values shared by the build, gateway and installer renderer.
# Website/browser entry and device relay are separate services. Do not derive
# relay or OIDC hostnames from the display brand. Legacy storage names stay
# stable to preserve sessions, credentials and device identity across upgrades.
# Select archived artwork with: python3 scripts/switch-logo.py <logo-id>
productName   = stand        # 展示名（UI、dmg/msi）——当前品牌，改名时改这里
lowerName     = stand        # 小写（jar 名、二进制名、localStorage 前缀目标）
# Console logo references (source files stay in the logo catalog).
logoUrl = /brand/releases/71a456e2d388b27e/symbol-light.svg
logoDarkUrl = /brand/releases/71a456e2d388b27e/symbol-dark.svg
fullName      = stand        # Full display name
domain        = mystand.space   # Display-only website domain
profileUrl    = https://mystand.space/profile
loginUrl      = https://mystand.space/login
installUrl    = https://nebflow.space/install.sh  # Existing release bridge
portalUrl     = https://mystand.space/portal  # Browser entry; separate from the device relay
serverUrl     = https://link.mystand.space     # 设备互联默认 server，当前真值
githubOrg     = MashiroKai
githubRepo    = Nebflow
homeDirName   = .stand       # 默认数据根（无 env 的新装机器/新用户直接落这里）；旧 ~/.nebflow 是硬编码 legacy 兜底，不从此键派生
envPrefix     = STAND        # STAND_HOME 第一优先级；NEBFLOW_HOME 保留为 permanent legacy fallback
configFileName = nebflow.json # Stable config filename
cosBucket     = nebflow-releases  # 键名保留（历史命名：COS 期键；2026-09-14 COS→OSS 切仓只改取值，不加 ossBucket 双读）
subsystemName = neblink      # D2：设备互联子系统名保持 neblink
activeLogo = stand-illustrator
