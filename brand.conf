# brand.conf — 唯一品牌事实源。改名 = 改这个文件 + 跑 scripts/rebrand.sh
# domain/profileUrl 双域机制（2026-09-01 登录链修复）：
#   默认（调试）= neblink.space；发布环境设 NEBFLOW_BRAND_DOMAIN=nebflow.space
#   + NEBFLOW_PROFILE_URL=https://nebflow.space/profile 即自动替换（Branding.env 双前缀读取）。
#   profileUrl 是前端 profile 链接的唯一来源（activityBar.js 消费它拼 URL）；
#   domain 保持 display-only 语义（前端禁止用 domain 构建 URL）。
productName   = Nebflow      # 展示名（UI、dmg/msi）——当前品牌，改名时改这里
lowerName     = nebflow      # 小写（jar 名、二进制名、localStorage 前缀目标）
fullName      = Nebflow      # 全名（about、文档首现）
domain        = neblink.space   # 调试域真值（原占位 neblink.example，2026-09-01 登录链修复定值）
profileUrl    = https://neblink.space/profile  # 调试 profile 页真值；发布 env 覆盖为 nebflow.space
installUrl    = https://nebflow.space/install.sh  # 当前真值
serverUrl     = https://neblink.nebflow.space     # 设备互联默认 server，当前真值
githubOrg     = MashiroKai
githubRepo    = Nebflow
homeDirName   = .nebflow     # L3 批3 用（当前值，迁移逻辑改名日激活）
envPrefix     = NEBFLOW      # L3 批3 用
configFileName = nebflow.json # L3 批3 用：配置文件名（双读，当前值=旧名零行为）
cosBucket     = nebflow-releases-1411212853
subsystemName = neblink      # D2：设备互联子系统名保持 neblink
