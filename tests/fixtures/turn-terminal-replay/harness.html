<!DOCTYPE html>
<!-- turn-terminal-replay harness.html — 回放折叠「A 根治」实施批（2026-10-28）
     静态试验台。导入**真实**渲染模块（persistence.js / turnGroup.js / chatView.js，
     无 stub、无打包），暴露两个驱动：

       window.__replay(msgs, opts) → 全新 #chat + restoreFromBackendHistory(msgs, opts)
                                     —— 刷新后 historyPage 初载腿的同一函数；
       window.__counts()           → 折叠现场读数（headers / tucked / 裸工具卡 /
                                     terminal 行标 / 徽章行）。

     被测树 = 伺服根（本树或 NB_UX_ROOT 红腿基线树——spec 把本 harness 覆盖复制
     过去，history-replay-cards 同款自举）。驱动里 await import(...) 拿到的是
     **该树**的模块 ⇒ 同一份 harness 在两棵树上的行为差 = 被测代码差。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>turn-terminal-replay harness</title>
  <link rel="stylesheet" href="/src/main/resources/web/css/base.css">
  <link rel="stylesheet" href="/src/main/resources/web/css/chat.css">
  <style>
    /* Minimal stand-in for the app shell (history-replay harness 同款). */
    html, body { margin: 0; height: 100%; background: var(--color-bg, #101418); }
    #chat {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 680px; max-width: 96vw; margin: 0; padding: 16px 0 36px;
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    const WEB = '/src/main/resources/web/js';

    const { chatViews, ChatView, setActiveView } = await import(`${WEB}/chatView.js`);
    const stateMod = await import(`${WEB}/state.js`);
    const state = stateMod.default;

    const chatEl = document.getElementById('chat');
    chatViews.primary = new ChatView('primary', { chat: chatEl });
    setActiveView(chatViews.primary);
    state.activeSessionId = 'harness-session';
    // Nothing may reach a real socket in this harness.
    state.ws = { readyState: 1, send: () => {} };
    try { localStorage.removeItem('nebflow_sessions'); } catch {}

    async function freshChat() {
      const chat = (chatViews.primary && chatViews.primary.dom && chatViews.primary.dom.chat) || chatEl;
      chat.innerHTML = '';
      return chat;
    }

    /** 刷新回放腿：全新容器 + 真实 restoreFromBackendHistory。 */
    window.__replay = async (msgs, opts = {}) => {
      await freshChat();
      const { restoreFromBackendHistory } = await import(`${WEB}/persistence.js`);
      restoreFromBackendHistory(msgs, opts);
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      return window.__counts();
    };

    /** 折叠现场读数（形态红线：turn-header 常驻 + 行 tucked + 点开可展）。 */
    window.__counts = () => {
      const chat = chatEl;
      const headers = [...chat.querySelectorAll(':scope > .turn-header')];
      const toolRows = [...chat.querySelectorAll(':scope > .row.tool')];
      const aiRows = [...chat.querySelectorAll(':scope > .row.ai')];
      return {
        headers: headers.length,
        headerStates: headers.map(h => h.dataset.turnState || ''),
        headerTexts: headers.map(h => (h.querySelector('.turn-header-text') || {}).textContent || ''),
        tools: toolRows.length,
        toolsTucked: toolRows.filter(r => r.classList.contains('nf-tucked')).length,
        aiRows: aiRows.length,
        // 纯徽章行（无气泡、行上直接挂 duration-badge）—— bug 修的产物面
        bareBadgeRows: aiRows.filter(r => !r.querySelector('.bubble.ai') && r.querySelector('.duration-badge')).length,
        terminalStamped: aiRows.filter(r => r.dataset && r.dataset.nfTurnTerminal === '1').length,
        // 卫生批（2026-10-28）工具行等价终态面：terminal 盖戳的工具行读数。
        toolTerminalStamped: toolRows.filter(r => r.dataset && r.dataset.nfTurnTerminal === '1').length,
        phraseBadges: chat.querySelectorAll(':scope > * .duration-badge[data-nf-phrase], :scope > .row.ai > .duration-badge[data-nf-phrase]').length,
        userRows: chat.querySelectorAll(':scope > .row.user').length,
      };
    };

    window.__ready = true;
  </script>
</body>
</html>
