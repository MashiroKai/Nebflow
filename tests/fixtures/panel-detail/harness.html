<!DOCTYPE html>
<!-- panel-detail harness.html — static test harness for the stream-919-unify
     batch (author 2026-10-07 22:34→10:10 澄清令: 「当行流式改为跟 9.19 显示方式，
     不是把工具结果展开」). Supersedes the 分层展示批 dual-face harness — d780's
     panel branch is RETIRED and the two views below are now the SAME unified
     9.19-style face (single-line streaming work-line, tucked completed cards,
     detail line on both).

     Imports the REAL frontend modules (chatView.js / chat.js / turnGroup.js /
     persistence.js / workline.js / state.js — no stubs, no bundling) and mounts
     TWO views side by side:

       #main-chat   → the 'primary' ChatView  — the main chat flow.
       #panel-chat  → a 'bgagent-*' ChatView constructed exactly the way
                      bgAgentPopup.js ensureStepView does (NO face opts — the
                      d780 panelFace opt-in is retired) — the monitoring panel.

     The same tool-activity feed can be replayed into EITHER view (route = the
     view that activeView points at, identical to the app's ws.js dispatch), so
     the spec can pin the UNIFIED FACE on identical data: both containers must
     render byte-for-byte the same shapes.

     Thinking-window probe (§③ 思考窗硬上限, same batch): __pdThink feeds real
     appendThinkingDelta frames; __pdThinkDone runs finishThinking; the census
     exposes the .thinking-content window (max-height / client height /
     scrollability / data-nf-think-lines count) and the bubble row height for
     the zero-downstream-expansion assertion.

     Exposed calls (all replay the exact calls the WS handlers make):

       window.__pdUse(which)            → setActiveView(main|panel view)
       window.__pdUser(text)            → renderUserBubble
       window.__pdCallStart(name)       → renderToolPending + arg-buffer reset
       window.__pdArg(name, chunk)      → appendToolStreamDelta
       window.__pdExecStart(label)      → renderToolPending (full label)
       window.__pdDone(label, summary,
                       content, err, in)→ renderTool
       window.__pdFinishTurn(ms, model) → appendAiText + finishAi + collapseTurn
       window.__pdThink(chunk, mark)    → appendThinkingDelta (live rAF flush)
       window.__pdThinkDone()           → finishThinking
       window.__pdHistory(msgs)         → restoreFromBackendHistory (the panel
                                          open/getHistory shape)
       window.__pdCensus(which)         → DOM-contract census of that face
       window.__pdClickHeader(which)    → click the settled .turn-header
       window.__pdNewPlainView()        → ChatView without any face opts
                                          (the search-float shape) → marker probe
       window.__pdReset(which)          → clear that container

     Served over a throwaway static file server spawned and killed by the spec
     itself (never the 8080 host) — same discipline as tests/fixtures/toolline-detail.
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>panel-detail harness</title>
  <link rel="stylesheet" href="/src/main/resources/web/css/base.css">
  <link rel="stylesheet" href="/src/main/resources/web/css/chat.css">
  <style>
    html, body { margin: 0; height: 100%; background: var(--color-bg, #101418); }
    .pd-wrap { position: absolute; top: 0; bottom: 0; width: 420px; overflow: hidden; }
    #main-wrap { left: 0; }
    #panel-wrap { right: 0; }
    .pd-chat {
      height: 100%; overflow-y: auto;
      padding: 16px 12px 36px;
    }
  </style>
</head>
<body>
  <div class="pd-wrap" id="main-wrap"><div class="pd-chat" id="main-chat"></div></div>
  <div class="pd-wrap" id="panel-wrap"><div class="pd-chat" id="panel-chat"></div></div>
  <script type="module">
    const WEB = '/src/main/resources/web/js';

    const { chatViews, ChatView, setActiveView } = await import(`${WEB}/chatView.js`);
    const stateMod = await import(`${WEB}/state.js`);
    const state = stateMod.default;

    const mainEl = document.getElementById('main-chat');
    const panelEl = document.getElementById('panel-chat');

    chatViews.primary = new ChatView('primary', { chat: mainEl });
    // Exactly the bgAgentPopup.js ensureStepView construction — NO face opts
    // (the d780 panelFace opt-in is retired; both views are the unified face).
    const panelView = new ChatView('bgagent-pd-demo', { chat: panelEl });
    panelView.mounted = true;
    panelView.sessionId = 'delegate-pd-demo';
    panelView.visible = true;
    chatViews[panelView.id] = panelView;

    setActiveView(chatViews.primary);
    state.activeSessionId = 'pd-root-session';
    chatViews.primary.sessionId = 'pd-root-session';
    // No real socket may exist in this harness.
    state.ws = { readyState: 1, send: () => {} };

    const chatMod = await import(`${WEB}/chat.js`);
    const turnMod = await import(`${WEB}/turnGroup.js`);
    const persMod = await import(`${WEB}/persistence.js`);

    const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const viewOf = (which) => which === 'panel' ? panelView : chatViews.primary;
    const sidOf = (which) => which === 'panel' ? 'delegate-pd-demo' : 'pd-root-session';

    let current = 'main';
    window.__pdUse = async (which) => {
      current = which === 'panel' ? 'panel' : 'main';
      const v = viewOf(current);
      setActiveView(v);
      state.activeSessionId = sidOf(current);
      await raf2();
      return v.id;
    };

    window.__pdUser = async (text) => {
      chatMod.renderUserBubble(text, [], Date.now());
      await raf2();
    };

    window.__pdCallStart = async (name) => {
      const v = viewOf(current);
      chatMod.renderToolPending(name, sidOf(current));
      v.stream.toolStreamText = '';
      v.stream.toolStreamToolName = name;
      await raf2();
    };

    window.__pdArg = (name, chunk) => {
      chatMod.appendToolStreamDelta(name, chunk);
    };

    window.__pdExecStart = async (label) => {
      chatMod.renderToolPending(label, sidOf(current));
      await raf2();
    };

    window.__pdDone = async (label, summary, content, isError, input) => {
      chatMod.renderTool(label, summary, content, !!isError, input, sidOf(current));
      await raf2();
    };

    window.__pdFinishTurn = async (durationMs = 4200, model = 'test-model', text = '本回合的最终回复。') => {
      const v = viewOf(current);
      chatMod.appendAiText(text);
      chatMod.finishAi(durationMs, model);
      turnMod.collapseTurn(v, {
        durationMs, model,
        phrase: '✻ 快速确认 4 秒',
        title: '17:30',
        sessionId: sidOf(current),
      });
      await raf2();
    };

    // Panel open shape: activeView = the panel view, then the getHistory frame.
    window.__pdHistory = async (msgs) => {
      persMod.restoreFromBackendHistory(msgs, { scrollToBottom: false, busyTail: false });
      await raf2();
    };

    window.__pdClickHeader = async (which) => {
      const chat = viewOf(which).dom.chat;
      const header = chat.querySelector('.turn-header');
      if (header) header.click();
      await raf2();
    };

    // ── §③ 思考窗硬上限 probe（stream-919-unify 批）──
    // Real live frames: appendThinkingDelta accumulates + rAF flush (the exact
    // main.js thinkingDelta handler shape — the caller awaits a raf2 between
    // chunks so each frame lands). mark mirrors the B2 (round, block) identity.
    window.__pdThink = async (chunk, mark) => {
      chatMod.appendThinkingDelta(chunk, mark || { round: 0, block: 0 });
      await raf2();
    };

    window.__pdThinkDone = async () => {
      chatMod.finishThinking();
      await raf2();
    };

    // Click the thinking label to re-reveal the content (bindCollapsibleToggle)
    // — the expand-face read the §③ window assertions run against.
    window.__pdThinkLabel = async (which) => {
      const chat = viewOf(which).dom.chat;
      const lbl = chat.querySelector('.thinking-label');
      if (lbl) lbl.click();
      await raf2();
    };

    // The search-float shape: a non-primary view WITHOUT any opts must stay on
    // the unified face (marker absent — the route reader itself is retired).
    window.__pdNewPlainView = () => {
      const el = document.createElement('div');
      const v = new ChatView('search-float', { chat: el });
      return { id: v.id, marker: el.classList.contains('nf-panel'), staticCls: el.classList.contains('nf-static') };
    };

    // DOM-contract census of one face. Everything the spec asserts is read off
    // classes/geometry only — no internals.
    window.__pdCensus = (which) => {
      const chat = viewOf(which).dom.chat;
      const kids = Array.from(chat.children);
      const line = kids.find(el => el.classList.contains('nf-workline'));
      const item = line ? line.querySelector('.nf-wl-slot')?.lastElementChild : null;
      const detail = item ? item.querySelector('.nf-wl-detail') : null;
      const label = item ? item.querySelector('.nf-wl-label') : null;
      const toolRows = Array.from(chat.querySelectorAll('.row.tool'));
      const headers = kids.filter(k => k.classList.contains('turn-header'));
      // §③ thinking-window read: the .thinking-content box against its cap —
      // declared max-height, rendered client height, scroll state, the count
      // reading (data-nf-think-lines) and the owning bubble row height (the
      // downstream-layout containment fact).
      const tContent = chat.querySelector('.thinking-bubble .thinking-content');
      let think = null;
      if (tContent) {
        const cs = getComputedStyle(tContent);
        think = {
          present: true,
          count: tContent.dataset.nfThinkLines || '',
          maxHeightPx: parseFloat(cs.maxHeight) || 0,
          lineHeightPx: parseFloat(cs.lineHeight) || 0,
          clientH: tContent.clientHeight,
          scrollH: tContent.scrollHeight,
          scrollable: tContent.scrollHeight > tContent.clientHeight + 0.5,
          overflowY: cs.overflowY,
          rowH: (tContent.closest('.row') || {}).offsetHeight || 0,
          displayNone: cs.display === 'none',
        };
      }
      return {
        marker: chat.classList.contains('nf-panel'),
        staticCls: chat.classList.contains('nf-static'),
        linePresent: !!line,
        itemKind: item ? (item.classList.contains('is-done') ? 'done'
                        : item.classList.contains('is-error') ? 'error' : 'running') : null,
        itemText: label ? label.textContent : '',
        detailPresent: !!detail,
        detailText: detail ? detail.textContent : '',
        think,
        tools: toolRows.map(r => {
          const card = r.querySelector('.tool-card');
          const body = card ? card.querySelector('.body') : null;
          const detailCmd = body ? body.querySelector('.detail-cmd') : null;
          const pre = body ? body.querySelector('pre') : null;
          return {
            tucked: r.classList.contains('nf-tucked'),
            visible: r.offsetHeight > 0,
            label: (card?.querySelector('.label')?.textContent || '').trim(),
            hasBody: !!body,
            bodyOpenCls: body ? body.classList.contains('open') : false,
            bodyVisible: body ? body.offsetHeight > 0 : false,
            cmdText: detailCmd ? detailCmd.textContent : '',
            preText: pre ? pre.textContent : '',
          };
        }),
        headers: headers.map(h => ({
          text: (h.querySelector('.turn-header-text')?.textContent || '').trim(),
          state: h.dataset.turnState || '',
        })),
      };
    };

    window.__pdReset = async (which) => {
      viewOf(which).dom.chat.innerHTML = '';
      await raf2();
    };

    window.__ready = true;
  </script>
</body>
</html>
