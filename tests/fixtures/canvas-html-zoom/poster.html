<!DOCTYPE html>
<!-- Zoom spec fixture — self-contained poster-style page (no external deps).
     #zoom-marker is the CAD-anchor probe: its boundingBox must stay within
     ±1px across a ctrl+wheel zoom centered on it. 30 filler rows make the
     document taller than the viewer viewport so native iframe scrolling can
     be asserted (plain wheel must scroll, never zoom). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f5f6f8; color: #16181d;
               font-family: -apple-system, 'Helvetica Neue', sans-serif; }
  #zoom-marker { position: absolute; left: 220px; top: 160px; width: 96px; height: 44px;
                 background: #0a84ff; color: #fff; border-radius: 8px;
                 display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .row { height: 44px; border-bottom: 1px solid #d9dce3; box-sizing: border-box;
         padding: 12px 16px; font-size: 12px; color: #5a6072; }
</style>
</head>
<body>
  <div id="zoom-marker">ANCHOR</div>
  <div class="row">row 01 — Nebflow canvas html zoom fixture</div>
  <div class="row">row 02</div>
  <div class="row">row 03</div>
  <div class="row">row 04</div>
  <div class="row">row 05</div>
  <div class="row">row 06</div>
  <div class="row">row 07</div>
  <div class="row">row 08</div>
  <div class="row">row 09</div>

  <div class="row">row 12</div>
  <div class="row">row 13</div>

  <div class="row">row 18</div>
  <div class="row">row 19</div>
  <div class="row">row 20</div>
  <div class="row">row 21</div>
  <div class="row">row 22</div>

</body>
</html>
