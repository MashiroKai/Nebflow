<!DOCTYPE html>
<!-- turn-collapse harness.html — static test harness for the #346 v2
     "decompression model" (2026-09-05 23:44 author ruling: 思考直播回归 +
     收起/展开语义重做; 2026-09-06 08:19 feedback: 动画层全摘——直落/直剥,
     总结行换行完整显示, ✻ 设计字句恢复进题头).

     Imports the REAL frontend modules (chatView.js / chat.js / turnGroup.js /
     persistence.js — no stubs, no bundling) and replays the exact calls the
     app makes on WS events / history restore:

       window.__liveTurn()          → thinking → 文字A → 工具1 → 文字B → 注入
                                      → 工具2 → 最终回复, then collapseTurn()
                                      exactly like the main.js `done` handler.
       window.__multiRoundTurn()    → MemoryEdit×5 → text → Task×4 → text →
                                      final (one turn, two LLM tool rounds →
                                      ONE header, count 9).
       window.__postClosureTurn()   → an external injection arriving AFTER the
                                      closure cursor + a follow-up turn and
                                      its collapseTurn() (#403 2026-08-26).
       window.__refailTurn()        → same-turn re-terminal heal: failTurn()
                                      right after __liveTurn's done (no rows
                                      appended between) — the v2 dissolve
                                      clears header + tuck marks, rows stay
                                      put and visible.
       window.__thinkingStreamStart() → user row + live thinking deltas ONLY
                                      (streaming state — no finishThinking).
       window.__thinkingStreamFinish() → finishThinking + text reply + done
                                      collapseTurn (completes the stream).
       window.__textOnlyTurn()      → zero-process turn (E5): no header, no
                                      tuck, previous header stays visible.
       window.__history(msgs, opts) → restoreFromBackendHistory(msgs, opts)
                                      (the post-refresh path; fixture shape
                                      matches the real ~/.nebflow session
                                      ui.json entries).

     The specs (tests/turn-collapse-keep-text.spec.mjs,
     tests/turn-header-persistent.spec.mjs, tests/turn-single-badge.spec.mjs)
     serve the repo root over a throwaway static file server spawned and
     killed by the spec itself (never the 8080 host).
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>turn-collapse harness</title>
  <link rel="stylesheet" href="/src/main/resources/web/css/base.css">
  <link rel="stylesheet" href="/src/main/resources/web/css/chat.css">
  <style>
    /* Minimal stand-in for the app shell: give #chat the column width the
       real layout gives it, everything else comes from the real CSS. */
    html, body { margin: 0; height: 100%; background: var(--color-bg, #101418); }
    #chat {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 680px; max-width: 96vw; margin: 0; padding: 16px 0 36px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    const WEB = '/src/main/resources/web/js';

    const { chatViews, ChatView, setActiveView } = await import(`${WEB}/chatView.js`);
    const stateMod = await import(`${WEB}/state.js`);
    const state = stateMod.default;

    const chatEl = document.getElementById('chat');
    chatViews.primary = new ChatView('primary', { chat: chatEl });
    setActiveView(chatViews.primary);
    state.activeSessionId = 'harness-session';
    // No real socket may exist in this harness.
    state.ws = { readyState: 1, send: () => {} };

    const chatMod = await import(`${WEB}/chat.js`);
    const turnMod = await import(`${WEB}/turnGroup.js`);
    const view = chatViews.primary;

    const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    // No animation layer (2026-09-06): tuck/untuck are synchronous class
    // flips — two RAFs are enough for layout to settle after a scenario.

    // thinking(直播) → 文字A → 工具1 → 文字B → 注入 → 工具2 → 最终回复 + done
    // 收起（对齐 main.js done handler 的 collapseTurn 调用形态：meta 带
    // durationMs/model/phrase/title——✻ phrase 于 2026-09-06 恢复上摘要行，
    // 作为题头首段）。
    window.__liveTurn = async () => {
      chatMod.renderUserBubble('帮我整理这份资料的关键结论', [], Date.now());
      // thinking 段（直播展开，2026-09-05 思考直播回归）
      chatMod.appendThinkingDelta('先拆解问题：资料分三块，逐块提取结论。');
      chatMod.appendThinkingDelta('需要检索佐证。');
      chatMod.finishThinking();
      // 文字A — 中间文字（roundComplete finalize 形态：无 duration badge）
      chatMod.appendAiText('好的，我先检索资料，再逐段汇报进展。');
      chatMod.finishAi();
      // 工具1
      chatMod.renderTool('WebSearch\n  ("nebflow turn collapse")', '5 results', 'search results body', false, '{"query":"nebflow turn collapse"}', 'harness-session');
      // 文字B — 中间文字
      chatMod.appendAiText('找到关键线索了：收起分组在 turnGroup.js，继续核对细节。');
      chatMod.finishAi();
      // 注入事件（工具间外部注入）
      chatMod.renderInjectedBubble('【Team】swift-dev 汇报：子任务已启动', 'team/swift-dev', Date.now(), 'mail', 'swift-dev', 'ReminderIsland', 'queue');
      // 工具2
      chatMod.renderTool('Read\n  ("turnGroup.js")', '120 lines', 'file body', false, '{"file_path":"/tmp/turnGroup.js"}', 'harness-session');
      // 最终回复（done：带 duration badge）
      chatMod.appendAiText('这是最终回复：中间过程已收起，回复与卡片照常可见。');
      chatMod.finishAi(4200, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 4200,
        model: 'test-model',
        phrase: '✻ 整理线索 4 秒',
        title: '10:30',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 闭合后到达的外部事件开新 turn（#403 2026-08-26 裁定回归）：新 turn 的
    // 注入+工具+最终回复 + done 收起。必须在 __liveTurn 之后调用。
    window.__postClosureTurn = async () => {
      chatMod.renderInjectedBubble('【Schedule】每日站会提醒', 'schedule', Date.now(), 'schedule', '', '', 'immediate');
      chatMod.renderTool('Bash\n  (git status)', 'clean', 'git output', false, '{"command":"git status"}', 'harness-session');
      chatMod.appendAiText('新回合的最终回复。');
      chatMod.finishAi(1500, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 1500,
        model: 'test-model',
        phrase: '✻ 快速确认 2 秒',
        title: '10:31',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 同 turn 重终态治愈（v2 dissolve）：done 后紧跟 error（期间无新行追加），
    // header 移除、tuck 标记清除——行从未移动，直接全部可见。必须在
    // __liveTurn 之后调用。
    window.__refailTurn = async () => {
      turnMod.failTurn(view);
      await raf2();
    };

    // 2026-09-05 多轮聚合场景（作者 08:48 截图复刻延续）：一个 turn 内两轮
    // LLM 工具循环——MemoryEdit×5 → 中间文字A → Task×4 → 中间文字B → 最终
    // 回复。恰一个 header，计数=全轮合计 9。
    window.__multiRoundTurn = async () => {
      chatMod.renderUserBubble('把记忆里的项目进展全部更新一遍，然后派子任务收集数据', [], Date.now());
      // 第一轮 LLM：MemoryEdit ×5
      for (let i = 1; i <= 5; i++) {
        chatMod.renderTool(`MemoryEdit\n  ("progress-${i}.md")`, 'updated', `patch body ${i}`, false, `{"file_path":"progress-${i}.md"}`, 'harness-session');
      }
      // 中间文字A（roundComplete finalize 形态：无 duration badge）
      chatMod.appendAiText('第一轮记忆更新完成，接着派 4 个子任务并行收集数据。');
      chatMod.finishAi();
      // 第二轮 LLM：Task ×4
      for (let i = 1; i <= 4; i++) {
        chatMod.renderTool(`Task\n  (worker-${i})`, 'started', `delegate ${i}`, false, `{"name":"worker-${i}"}`, 'harness-session');
      }
      // 中间文字B
      chatMod.appendAiText('子任务全部派出，等待回收结果后汇总。');
      chatMod.finishAi();
      // 最终回复（done：带 duration badge）
      chatMod.appendAiText('全部完成：记忆已更新，4 路数据收集任务已启动并回收。');
      chatMod.finishAi(205000, 'zhipu/GLM-5.3-Flash');
      turnMod.collapseTurn(view, {
        durationMs: 205000,
        model: 'zhipu/GLM-5.3-Flash',
        phrase: '✻ 买了张去星辰的车票，3m 25s 到站',
        title: '08:45',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 思考直播（2026-09-05 回归）：只铺 user + 流式 thinking delta，
    // 不 finish——断言流式期间内容可见。
    window.__thinkingStreamStart = async () => {
      chatMod.renderUserBubble('看看你怎么想', [], Date.now());
      chatMod.appendThinkingDelta('第一段思考：问题需要拆解。');
      chatMod.appendThinkingDelta('第二段思考：逐块核对。');
      await raf2();
    };

    // 完成上面的流（中间态）：finishThinking + 文字流开始，但不 finishAi
    // 不 done——断言 thinking 段结束后内容仍可见（只有终态才收）。
    window.__thinkingStreamMid = async () => {
      chatMod.finishThinking();
      chatMod.appendAiText('思考后的答案。');
      await raf2();
    };

    // 完成上面的流（终态）：finishAi 带 badge + 收起。断言 thinking 行随
    // turn 收起。
    window.__thinkingStreamFinish = async () => {
      chatMod.finishAi(3000, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 3000,
        model: 'test-model',
        phrase: '',
        title: '10:40',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // E10 钩子：消息搜索命中被收起 turn 时的展开入口。
    window.__expandContaining = (el) => turnMod.expandGroupContaining(el);

    // E5 纯文字 turn：零过程行、不产 header——前一条最新 header 必须保持
    // 可见不被顶掉。
    window.__textOnlyTurn = async () => {
      chatMod.renderUserBubble('纯文字追问', [], Date.now());
      chatMod.appendAiText('纯文字收尾。');
      chatMod.finishAi(1000, 'm-two');
      turnMod.collapseTurn(view, {
        durationMs: 1000,
        model: 'm-two',
        phrase: '',
        title: '10:32',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 历史重建（刷新后路径）：msgs 为真实 ui.json 形态。
    window.__history = async (msgs, opts = {}) => {
      chatEl.innerHTML = '';
      const { restoreFromBackendHistory } = await import(`${WEB}/persistence.js`);
      restoreFromBackendHistory(msgs, opts);
      await raf2();
    };

    window.__ready = true;
  </script>
</body>
</html>
