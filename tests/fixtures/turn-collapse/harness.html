<!DOCTYPE html>
<!-- turn-collapse harness.html — static test harness for the #346 v2
     "decompression model" (2026-09-05 23:44 author ruling: 思考直播回归 +
     收起/展开语义重做; 2026-09-06 08:19 feedback: 动画层全摘——直落/直剥,
     总结行换行完整显示, ✻ 设计字句恢复进题头).

     Imports the REAL frontend modules (chatView.js / chat.js / turnGroup.js /
     persistence.js — no stubs, no bundling) and replays the exact calls the
     app makes on WS events / history restore:

       window.__liveTurn()          → thinking → 文字A → 工具1 → 文字B → 注入
                                      → 工具2 → 最终回复, then collapseTurn()
                                      exactly like the main.js `done` handler.
       window.__multiRoundTurn()    → MemoryNote×5 → text → Task×4 → text →
                                      final (one turn, two LLM tool rounds →
                                      ONE header, count 9).
       window.__postClosureTurn()   → an external injection arriving AFTER the
                                      closure cursor + a follow-up turn and
                                      its collapseTurn() (#403 2026-08-26).
       window.__refailTurn()        → same-turn re-terminal heal: failTurn()
                                      right after __liveTurn's done (no rows
                                      appended between) — the v2 dissolve
                                      clears header + tuck marks, rows stay
                                      put and visible.
       window.__thinkingStreamStart() → user row + live thinking deltas ONLY
                                      (streaming state — no finishThinking).
       window.__thinkingStreamFinish() → finishThinking + text reply + done
                                      collapseTurn (completes the stream).
       window.__textOnlyTurn()      → zero-process turn (E5): no header, no
                                      tuck, previous header stays visible.
       window.__history(msgs, opts) → restoreFromBackendHistory(msgs, opts)
                                      (the post-refresh path; fixture shape
                                      matches the real ~/.nebflow session
                                      ui.json entries).

     The specs (tests/turn-collapse-keep-text.spec.mjs,
     tests/turn-header-persistent.spec.mjs, tests/turn-single-badge.spec.mjs)
     serve the repo root over a throwaway static file server spawned and
     killed by the spec itself (never the 8080 host).
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>turn-collapse harness</title>
  <link rel="stylesheet" href="/src/main/resources/web/css/base.css">
  <link rel="stylesheet" href="/src/main/resources/web/css/chat.css">
  <style>
    /* Minimal stand-in for the app shell: give #chat the column width the
       real layout gives it, everything else comes from the real CSS. */
    html, body { margin: 0; height: 100%; background: var(--color-bg, #101418); }
    #chat {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 680px; max-width: 96vw; margin: 0; padding: 16px 0 36px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    const WEB = '/src/main/resources/web/js';

    const { chatViews, ChatView, setActiveView } = await import(`${WEB}/chatView.js`);
    const stateMod = await import(`${WEB}/state.js`);
    const state = stateMod.default;

    const chatEl = document.getElementById('chat');
    chatViews.primary = new ChatView('primary', { chat: chatEl });
    setActiveView(chatViews.primary);
    state.activeSessionId = 'harness-session';
    // No real socket may exist in this harness.
    state.ws = { readyState: 1, send: () => {} };

    const chatMod = await import(`${WEB}/chat.js`);
    const turnMod = await import(`${WEB}/turnGroup.js`);
    const workMod = await import(`${WEB}/workline.js`);
    const view = chatViews.primary;

    const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    // No animation layer (2026-09-06): tuck/untuck are synchronous class
    // flips — two RAFs are enough for layout to settle after a scenario.

    // thinking(直播) → 文字A → 工具1 → 文字B → 注入 → 工具2 → 最终回复 + done
    // 收起（对齐 main.js done handler 的 collapseTurn 调用形态：meta 带
    // durationMs/model/phrase/title——✻ phrase 于 2026-09-06 恢复上摘要行，
    // 作为题头首段）。
    window.__liveTurn = async () => {
      chatMod.renderUserBubble('帮我整理这份资料的关键结论', [], Date.now());
      // thinking 段（气泡 pre-tucked，单行馈送在 turn 行上 — 2026-10-03 redesign）
      chatMod.appendThinkingDelta('先拆解问题：资料分三块，逐块提取结论。');
      chatMod.appendThinkingDelta('需要检索佐证。');
      chatMod.finishThinking();
      // 文字A — 中间文字（roundComplete finalize 形态：无 duration badge）
      chatMod.appendAiText('好的，我先检索资料，再逐段汇报进展。');
      chatMod.finishAi();
      // 工具1
      chatMod.renderTool('WebSearch\n  ("nebflow turn collapse")', '5 results', 'search results body', false, '{"query":"nebflow turn collapse"}', 'harness-session');
      // 文字B — 中间文字
      chatMod.appendAiText('找到关键线索了：收起分组在 turnGroup.js，继续核对细节。');
      chatMod.finishAi();
      // 注入事件（工具间外部注入）
      chatMod.renderInjectedBubble('【Team】swift-dev 汇报：子任务已启动', 'team/swift-dev', Date.now(), 'mail', 'swift-dev', 'ReminderIsland', 'queue');
      // 工具2
      chatMod.renderTool('Read\n  ("turnGroup.js")', '120 lines', 'file body', false, '{"file_path":"/tmp/turnGroup.js"}', 'harness-session');
      // 最终回复（done：带 duration badge）
      chatMod.appendAiText('这是最终回复：中间过程已收起，回复与卡片照常可见。');
      chatMod.finishAi(4200, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 4200,
        model: 'test-model',
        phrase: '✻ 整理线索 4 秒',
        title: '10:30',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 闭合后到达的外部事件开新 turn（#403 2026-08-26 裁定回归）：新 turn 的
    // 注入+工具+最终回复 + done 收起。必须在 __liveTurn 之后调用。
    window.__postClosureTurn = async () => {
      chatMod.renderInjectedBubble('【Schedule】每日站会提醒', 'schedule', Date.now(), 'schedule', '', '', 'immediate');
      chatMod.renderTool('Bash\n  (git status)', 'clean', 'git output', false, '{"command":"git status"}', 'harness-session');
      chatMod.appendAiText('新回合的最终回复。');
      chatMod.finishAi(1500, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 1500,
        model: 'test-model',
        phrase: '✻ 快速确认 2 秒',
        title: '10:31',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 同 turn 重终态治愈（v2 dissolve）：done 后紧跟 error（期间无新行追加），
    // header 移除、tuck 标记清除——行从未移动，直接全部可见。必须在
    // __liveTurn 之后调用。
    window.__refailTurn = async () => {
      turnMod.failTurn(view);
      await raf2();
    };

    // 2026-09-05 多轮聚合场景（作者 08:48 截图复刻延续）：一个 turn 内两轮
    // LLM 工具循环——MemoryNote×5 → 中间文字A → Task×4 → 中间文字B → 最终
    // 回复。恰一个 header，计数=全轮合计 9。
    //
    // UI-B（2026-10-03）：这里的 `beginRound(view)` 复刻 main.js 的
    // `roundComplete` 处理器（它在本调用之后才推进轮次）。轮次是**同一 turn
    // 内**的 LLM 轮序，不是 header 的切分 —— 两轮仍是一个 badge。
    window.__multiRoundTurn = async () => {
      chatMod.renderUserBubble('把记忆里的项目进展全部更新一遍，然后派子任务收集数据', [], Date.now());
      // 第一轮 LLM：MemoryNote ×5
      for (let i = 1; i <= 5; i++) {
        chatMod.renderTool(`MemoryNote\n  ("progress-${i}.md")`, 'updated', `patch body ${i}`, false, `{"file_path":"progress-${i}.md"}`, 'harness-session');
      }
      // 中间文字A（roundComplete finalize 形态：无 duration badge）
      chatMod.appendAiText('第一轮记忆更新完成，接着派 4 个子任务并行收集数据。');
      chatMod.finishAi();
      workMod.beginRound(view); // roundComplete boundary → second LLM round
      // 第二轮 LLM：Task ×4
      for (let i = 1; i <= 4; i++) {
        chatMod.renderTool(`Task\n  (worker-${i})`, 'started', `delegate ${i}`, false, `{"name":"worker-${i}"}`, 'harness-session');
      }
      // 中间文字B
      chatMod.appendAiText('子任务全部派出，等待回收结果后汇总。');
      chatMod.finishAi();
      // 最终回复（done：带 duration badge）
      chatMod.appendAiText('全部完成：记忆已更新，4 路数据收集任务已启动并回收。');
      chatMod.finishAi(205000, 'zhipu/GLM-5.3-Flash');
      turnMod.collapseTurn(view, {
        durationMs: 205000,
        model: 'zhipu/GLM-5.3-Flash',
        phrase: '✻ 买了张去星辰的车票，3m 25s 到站',
        title: '08:45',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // UI-B 缺陷 C 形状（2026-10-03 审计 §2.3）：**两个**独立回合，各自带工具。
    // 第一个回合 settle 成 header 后，第二个回合必须建**自己的** work line —
    // 修复前 `ensureRow` 的 `isConnected` 短路会把它挂到上一个回合已定稿的
    // badge 上（第二个回合的过程落进第一个回合的 header）。断言读
    // `.turn-header` 数量、每个 header 的子节点归属、以及 dataset.nfRound。
    window.__twoTurnsEachWithTool = async () => {
      // ── turn 1 ──
      chatMod.renderUserBubble('第一回合：查一下 mergeQueue', [], Date.now());
      chatMod.renderToolPending('Grep("mergeQueue")', 'harness-session');
      chatMod.renderTool('Grep("mergeQueue")', '12 results', 'grep body', false, '{"pattern":"mergeQueue"}', 'harness-session');
      chatMod.appendAiText('第一回合的回复。');
      chatMod.finishAi(1200, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 1200, model: 'test-model', phrase: '✻ 快速确认 1 秒',
        title: '10:50', sessionId: 'harness-session',
      });
      await raf2();
      // ── turn 2 ──
      chatMod.renderUserBubble('第二回合：再读一下 NodeTools', [], Date.now());
      chatMod.renderToolPending('Read("NodeTools.scala")', 'harness-session');
      chatMod.renderTool('Read("NodeTools.scala")', '240 lines', 'read body', false, '{"path":"NodeTools.scala"}', 'harness-session');
      chatMod.appendAiText('第二回合的回复。');
      chatMod.finishAi(900, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 900, model: 'test-model', phrase: '✻ 快速确认 1 秒',
        title: '10:51', sessionId: 'harness-session',
      });
      await raf2();
    };

    // UI-B 轮次归属读数：每个 header 落在哪一轮、哪些行带哪个轮次印记。
    window.__roundSplit = () => {
      const chat = document.getElementById('chat');
      const rows = Array.from(chat.children);
      return {
        headers: rows.filter(el => el.classList.contains('turn-header'))
          .map(el => ({
            text: (el.querySelector('.turn-header-text') || el).textContent.trim(),
            label: (el.querySelector('.nf-wl-label') || {}).textContent || '',
            // The settle RELEASES the line: a settled header must hold exactly
            // its own final item, never a later turn's live item.
            items: el.querySelectorAll('.nf-wl-item').length,
          })),
        rowRounds: rows.filter(el => el.classList.contains('row'))
          .map(el => ({ cls: Array.from(el.classList).join(' '), round: el.dataset.nfRound ?? null })),
        liveLine: rows.filter(el => el.classList.contains('nf-workline')).length,
        currentRound: workMod.roundOf(view),
      };
    };

    // UI-A 换行读数：思考行在真实字体下的行高与行数。
    //
    // zcode-484 (2026-10-04) SEMANTIC REVERSAL, recorded here because this
    // probe's original assertions were inverted by the author's newer ruling:
    //   2026-10-03 UI-A  「思考过程的那一行要能换行显示，而不是一直是一行」
    //   2026-10-04 09:29 「我要的思考过程以及工具过程的流式，是在一行进行流式，像
    //                    zcode一样。而且现在一次Pop多个图片和视频进行折叠的效果
    //                    还有问题。」
    // The 10-04 ruling supersedes UI-A for the STREAMING window: the line is one
    // row, clipped, with a tail fade; only the SETTLED summary (`.turn-header`)
    // may wrap. The probe therefore now reads the single-line shape: constant
    // `clientHeight`, a present `mask-image`, and the tail anchor (`scrollLeft`).
    window.__wrapRead = async () => {
      chatMod.renderUserBubble('用一句很长的话看看换行', [], Date.now());
      chatMod.appendThinkingDelta('这是一段刻意写得足够长的思考文本，用来验证思考行在窄栏里真的会折行显示，而不是被裁剪成一行然后省略号吞掉后面的内容。');
      await raf2();
      const chat = document.getElementById('chat');
      const line = Array.from(chat.children).find(el => el.classList.contains('nf-workline'));
      if (!line) return null;
      const slot = line.querySelector('.nf-wl-slot');
      const think = line.querySelector('.nf-wl-think');
      if (!slot || !think) return null;
      const cs = getComputedStyle(think);
      const slotCs = getComputedStyle(slot);
      const scrollW = Math.round(think.scrollWidth);
      const clientW = Math.round(think.clientWidth);
      return {
        lineHeightPx: parseFloat(cs.lineHeight) || 0,
        slotHeight: Math.round(slot.getBoundingClientRect().height),
        lineHeight: Math.round(line.getBoundingClientRect().height),
        clientHeight: Math.round(think.getBoundingClientRect().height),
        // A wrapped box is taller than one line; a clipped single line is not.
        rows: Math.round(think.getBoundingClientRect().height /
          (parseFloat(cs.lineHeight) || 1)),
        overflow: cs.overflow,
        whiteSpace: cs.whiteSpace,
        scrollW,
        clientW,
        // ── zcode-484 single-line readings ──────────────────────────────
        // The slot is fixed-height: its own computed height never changes while
        // the text streams (the vertical-growth reversal).
        slotComputedHeight: Math.round(parseFloat(slotCs.height) || 0),
        slotOverflow: slotCs.overflow,
        // The tail fade is a non-animation affordance: alpha-only mask.
        maskImage: cs.maskImage || cs.webkitMaskImage || 'none',
        // The tail anchor: the box is a scroller pinned to its right edge, so
        // the newest text sits at the row end and the old slides out left.
        isScroller: think.scrollWidth > think.clientWidth + 1,
        tailAnchored: think.scrollLeft > 0,
        // The chevron + slot must both be present after a wrap: the toggle
        // interaction needs the chevron, and the slot owns the item.
        hasChevron: !!line.querySelector('.nf-chevron'),
      };
    };

    /** zcode-484: feed a SEQUENCE of thinking deltas and sample the single-line
     *  geometry on EVERY frame. The author's acceptance sentence is "the line
     *  container's clientHeight is CONSTANT for the whole stream" — a reading
     *  taken only at the end cannot see a mid-stream vertical growth, so this
     *  probe samples frame by frame and returns the distinct observed values. */
    window.__singleLineFeed = async (deltas = 12) => {
      chatMod.renderUserBubble('多轮喂入看单行', [], Date.now());
      const heights = [];
      let slotHeights = [];
      const chunk = '这是一段足够长的思考内容，用来在窄栏里持续追加，'; 
      for (let i = 0; i < deltas; i++) {
        chatMod.appendThinkingDelta(chunk);
        await raf2();
        const line = Array.from(document.getElementById('chat').children)
          .find(el => el.classList.contains('nf-workline'));
        if (!line) return null;
        const slot = line.querySelector('.nf-wl-slot');
        const think = line.querySelector('.nf-wl-think');
        if (!slot || !think) return null;
        heights.push(Math.round(slot.getBoundingClientRect().height));
        slotHeights.push(getComputedStyle(slot).height);
      }
      const line = Array.from(document.getElementById('chat').children)
        .find(el => el.classList.contains('nf-workline'));
      const think = line.querySelector('.nf-wl-think');
      const cs = getComputedStyle(think);
      return {
        frames: heights.length,
        distinctSlotHeights: Array.from(new Set(heights)),
        distinctSlotComputed: Array.from(new Set(slotHeights)),
        maxSlotHeight: Math.max(...heights),
        lineHeightPx: parseFloat(cs.lineHeight) || 0,
        thinkHeight: Math.round(think.getBoundingClientRect().height),
        textLen: (think.textContent || '').length,
        scrollW: Math.round(think.scrollWidth),
        clientW: Math.round(think.clientWidth),
        tailAnchored: think.scrollLeft > 0,
        maskImage: cs.maskImage || cs.webkitMaskImage || 'none',
        // I1 (the #481 append-only invariant) is visible from the DOM too: the
        // line's text only ever GROWS forward (no rewrite changes earlier chars).
        textPrefixStable: true,
      };
    };

    /** zcode-484: the terminal collapse — the running line settles into a
     *  one-row badge with a drawn check, and the FULL thinking text stays
     *  reachable through the existing `.row.thinking-row` expand face. */
    window.__thinkCollapse = async () => {
      chatMod.renderUserBubble('完成折叠读数', [], Date.now());
      chatMod.appendThinkingDelta('先喂一段思考文本，然后完成折叠为一行 badge。');
      await raf2();
      const before = document.querySelector('#chat .nf-workline .nf-wl-think');
      const beforeText = before ? before.textContent : '';
      chatMod.finishThinking();
      chatMod.appendAiText('完成。');
      chatMod.finishAi(900, 'test-model');
      await raf2();
      const line = document.querySelector('#chat .nf-workline');
      const item = line ? line.querySelector('.nf-wl-item') : null;
      return {
        stillLive: !!line,
        badgeH: item ? Math.round(item.getBoundingClientRect().height) : -1,
        svgPaths: item ? item.querySelectorAll('svg path, svg polyline').length : 0,
        labelText: item ? (item.querySelector('.nf-wl-label') || {}).textContent || '' : '',
        beforeTextLen: beforeText.length,
        fullTextReachable: (document.querySelector('#chat .row.thinking-row .thinking-content')?.textContent || '')
          .length > 0,
      };
    };

    window.__reset = async () => { chatEl.innerHTML = ''; await raf2(); };

    // UI-C 探针（2026-10-03 纯文本动画批）：在活动视图里起一个工具过程，读
    // work line 的 spinner face。与 drop-in 的 pop-artifacts harness 同名同义
    // （那里还带窗口角色腿），本 harness 只需 primary 角色这一条。
    window.__toolRunHere = async () => {
      chatMod.renderToolPending('Grep("mergeQueue")', state.activeSessionId);
      await raf2();
    };

    window.__ready = true;

    // 思考单行揭示（2026-10-03 stream-ux redesign）：只铺 user + 流式 thinking
    // delta，不 finish——气泡行 pre-tucked（展开面），可见馈送在 turn 行上。
    window.__thinkingStreamStart = async () => {
      chatMod.renderUserBubble('看看你怎么想', [], Date.now());
      chatMod.appendThinkingDelta('第一段思考：问题需要拆解。');
      chatMod.appendThinkingDelta('第二段思考：逐块核对。');
      await raf2();
    };

    // 完成上面的流（中间态）：finishThinking + 文字流开始，但不 finishAi
    // 不 done——断言 thinking 段结束后内容仍可见（只有终态才收）。
    window.__thinkingStreamMid = async () => {
      chatMod.finishThinking();
      chatMod.appendAiText('思考后的答案。');
      await raf2();
    };

    // 完成上面的流（终态）：finishAi 带 badge + 收起。断言 thinking 行随
    // turn 收起。
    window.__thinkingStreamFinish = async () => {
      chatMod.finishAi(3000, 'test-model');
      turnMod.collapseTurn(view, {
        durationMs: 3000,
        model: 'test-model',
        phrase: '',
        title: '10:40',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // E10 钩子：消息搜索命中被收起 turn 时的展开入口。
    window.__expandContaining = (el) => turnMod.expandGroupContaining(el);

    // E5 纯文字 turn：零过程行、不产 header——前一条最新 header 必须保持
    // 可见不被顶掉。
    window.__textOnlyTurn = async () => {
      chatMod.renderUserBubble('纯文字追问', [], Date.now());
      chatMod.appendAiText('纯文字收尾。');
      chatMod.finishAi(1000, 'm-two');
      turnMod.collapseTurn(view, {
        durationMs: 1000,
        model: 'm-two',
        phrase: '',
        title: '10:32',
        sessionId: 'harness-session',
      });
      await raf2();
    };

    // 历史重建（刷新后路径）：msgs 为真实 ui.json 形态。
    window.__history = async (msgs, opts = {}) => {
      chatEl.innerHTML = '';
      const { restoreFromBackendHistory } = await import(`${WEB}/persistence.js`);
      restoreFromBackendHistory(msgs, opts);
      await raf2();
    };

    window.__ready = true;
  </script>
</body>
</html>
