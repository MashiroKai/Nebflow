<!DOCTYPE html>
<!-- history-replay harness.html — static test harness for the history-replay
     card regression (AskUser cards / compaction cards).

     Imports the REAL frontend render modules (chat.js / persistence.js /
     chatView.js — no stubs, no bundling) and exposes two drivers:

       window.__replay()  → restoreFromBackendHistory(fixture)  — the exact
                            function the app runs after a browser refresh
                            (historyPage handler → main.js).
       window.__live()    → the exact live-render functions the app calls on
                            WS events (renderTool / renderAskUser /
                            renderCompactStartCard / renderCompactDoneCard /
                            renderUserBubble).

     The spec (tests/history-replay-cards.spec.mjs) serves the repo root over
     a throwaway static server (never the 8080 host) and drives both paths
     against the real fixture extracted from ~/.nebflow/sessions/.

     双开缺陷批（2026-09-21 chain-askuserdup）追加三个驱动 —— 静态镜像
     「历史恢复 + 重放帧」这条链（tests/askuser-dup-card.spec.mjs，双树对照：

       __replayNamed(name)  → restoreFromBackendHistory(<name>.json) + 读数快照
       __replayLeg(rid)     → 复刻 main.js 的重放腿：先按该树的判据回收既有卡
                              （新树 = 真实 reclaimAskUserCards；旧树 = 逐字复刻
                              改前 main.js:1483-1487 的 DOM 启发式），再挂重放卡
       __counts()           → 每卡 `.option-answer` / `.option-answer-pending` /
                              `.resolved` / data-request-id 的现场读数

     驱动里 `await import(...)` 拿到的是**该树**的模块（基线树 = pre-fix 代码）
     ⇒ 同一份 harness 在两棵树上的行为差 = 被测代码差。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>history-replay harness</title>
  <link rel="stylesheet" href="/src/main/resources/web/css/base.css">
  <link rel="stylesheet" href="/src/main/resources/web/css/chat.css">
  <style>
    /* Minimal stand-in for the app shell: give #chat the column width the
       real layout gives it, everything else comes from the real CSS. */
    html, body { margin: 0; height: 100%; background: var(--color-bg, #101418); }
    #chat {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 680px; max-width: 96vw; margin: 0; padding: 16px 0 36px;
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    const WEB = '/src/main/resources/web/js';

    const { chatViews, ChatView, setActiveView } = await import(`${WEB}/chatView.js`);
    const stateMod = await import(`${WEB}/state.js`);
    const state = stateMod.default;

    const chatEl = document.getElementById('chat');
    chatViews.primary = new ChatView('primary', { chat: chatEl });
    setActiveView(chatViews.primary);
    state.activeSessionId = 'harness-session';

    // Capture outgoing WS frames (the live AskUser confirm path sends one) —
    // nothing must reach a real socket in this harness.
    window.__captured = [];
    state.ws = { readyState: 1, send: (data) => window.__captured.push(JSON.parse(data)) };

    // AskUser card drafts live in localStorage keyed by session — keep runs
    // hermetic.
    try { localStorage.removeItem('nebflow_askuser_drafts'); } catch {}

    let _fixture = null;
    async function loadFixture() {
      if (!_fixture) _fixture = await (await fetch('./fixture.json')).json();
      return _fixture;
    }

    // ---- Driver 1: history replay (post-refresh path) ----
    window.__replay = async () => {
      const { restoreFromBackendHistory } = await import(`${WEB}/persistence.js`);
      restoreFromBackendHistory(await loadFixture());
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    };

    // ---- Driver 2: live render (WS-event path) ----
    // Replays the events in fixture order through the same functions the
    // onMessage handlers call. The user message that follows the askUser
    // entry is intentionally skipped: the backend records it, but the live
    // card-confirm path never renders a user bubble for it.
    window.__live = async () => {
      const chat = await import(`${WEB}/chat.js`);
      const msgs = await loadFixture();
      let afterAsk = false;
      for (const m of msgs) {
        if (m.type === 'tool') {
          chat.renderTool(m.label, m.summary, m.content, m.isError, m.input, 'harness-session');
        } else if (m.type === 'askUser') {
          chat.renderAskUser(m.items, 'harness-session', null, 'harness-req');
          afterAsk = true;
        } else if (m.type === 'user') {
          if (afterAsk) { afterAsk = false; continue; } // recorded answer, not a live bubble
          chat.renderUserBubble(m.text, m.attachments, m.timestamp);
        } else if (m.type === 'system' && m.i18nKey === 'chat.compacting') {
          chat.renderCompactStartCard(chatViews.primary);
        } else if (m.type === 'system' && m.i18nKey === 'chat.compacted') {
          chat.renderCompactDoneCard(chatViews.primary, {
            before: m.params.before, after: m.params.after, detail: m.params.detail,
          });
        } else if (m.type === 'ai') {
          if (m.thinking) { chat.appendThinkingDelta(m.thinking); chat.finishThinking(); }
          if (m.text) { chat.appendAiText(m.text); chat.finishAi(m.durationMs || 1200, m.model || 'test-model'); }
        }
      }
      await new Promise(r => setTimeout(r, 50));
    };

    window.__ready = true;

    // ---- 双开缺陷批（chain-askuserdup）：历史恢复 + 重放腿的三段驱动 ----

    /** 现场读数：每卡的关键类名/属性计数（二值断言的数据源）。 */
    window.__counts = () => {
      const boxes = [...document.querySelectorAll('#chat .option-box')];
      return {
        boxes: boxes.length,
        answered: boxes.filter(b => b.querySelector('.option-answer')).length,
        pendingNote: boxes.filter(b => b.querySelector('.option-answer-pending')).length,
        pendingNoteText: (boxes.find(b => b.querySelector('.option-answer-pending'))
          ?.querySelector('.option-answer-pending').textContent) || null,
        resolved: boxes.filter(b => b.classList.contains('resolved')).length,
        historyReplay: boxes.filter(b => b.dataset.historyReplay === '1').length,
        rids: boxes.map(b => b.dataset.requestId || ''),
        disabledBtns: boxes.reduce((n, b) => n + [...b.querySelectorAll('.option-btn')].filter(x => x.disabled).length, 0),
      };
    };

    async function freshChat() {
      const { chatViews, activeView } = await import(`${WEB}/chatView.js`);
      const chat = (activeView && activeView.dom && activeView.dom.chat) || chatEl;
      chat.innerHTML = '';
      return chat;
    }

    /** 历史恢复腿：喂 <name>.json（真实 historyPage.messages 形状）。 */
    window.__replayNamed = async (name) => {
      await freshChat();
      const { restoreFromBackendHistory } = await import(`${WEB}/persistence.js`);
      const msgs = await (await fetch(`./${name}.json`)).json();
      restoreFromBackendHistory(msgs);
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      return window.__counts();
    };

    /** 重放腿（复刻 main.js onMessage('askUser') 的 msg.replayed 分支）。
     *  🔴 **不清 DOM**：重放帧是在历史恢复之后的现场之上到达的（清空了就没有孪生卡
     *  可判，红/绿两侧都会假绿）。
     *  回收判据取**本树**的真身：新树有 reclaimAskUserCards（单一判据）就直接用；
     *  旧树（pre-fix）没有该导出 ⇒ 逐字复刻改前内联启发式（`answered` = 卡上有没有
     *  作答行 ⇒ 有则不删）—— 同一份驱动在两棵树上跑出各自代码的真实行为。 */
    window.__replayLeg = async (rid, items) => {
      const chatMod = await import(`${WEB}/chat.js`);
      const { activeView } = await import(`${WEB}/chatView.js`);
      const chat = (activeView && activeView.dom && activeView.dom.chat) || chatEl;
      if (typeof chatMod.reclaimAskUserCards === 'function') {
        chatMod.reclaimAskUserCards(chat, rid, { legacyTwin: true });
      } else {
        chat.querySelectorAll('.row.ai .option-box').forEach(box => {
          const boxRid = box.dataset.requestId || '';
          const answered = !!box.querySelector('.option-answer');
          if (!answered && (!boxRid || boxRid === rid)) box.closest('.row.ai').remove();
        });
      }
      chatMod.renderAskUser(items, 'harness-session', null, rid, null);
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      return window.__counts();
    };

    /** 单一判据单元读数：真实 renderAskUser 挂一张**已带作答行**的卡（历史的
     *  「假已作答」形态），再按 id 回收 —— 钉「id 命中无条件（不看作答行）」。
     *  旧树无该导出 ⇒ 返回 { supported:false }（红侧据此断言该判据缺失）。 */
    window.__reclaimUnit = async (rid) => {
      const chatMod = await import(`${WEB}/chat.js`);
      const chat = await freshChat();
      if (typeof chatMod.reclaimAskUserCards !== 'function') return { supported: false };
      const items = [{ question: 'unit-probe', options: [{ label: 'a' }] }];
      chatMod.renderAskUser(items, 'harness-session', null, rid, null);
      const box = chat.querySelector('.option-box');
      const fake = document.createElement('div');
      fake.className = 'option-answer';
      fake.textContent = '-> fake';
      box.appendChild(fake);
      const before = window.__counts();
      const removed = chatMod.reclaimAskUserCards(chat, rid, { legacyTwin: true });
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      return { supported: true, before, removed, after: window.__counts() };
    };
  </script>
</body>
</html>
