<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备授权 — NebLink</title>
<style>
  :root {
    --bg: #0f0f17; --surface: #1a1a2e; --surface-hover: #22223a;
    --border: #2d2d4a; --text: #e4e4ef; --text-muted: #8888aa;
    --primary: #7c5cfc; --primary-hover: #6a4de0;
    --danger: #e0556a; --success: #4ecdc4; --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .container { max-width: 460px; width: 100%; }
  .card {
    background: var(--surface); border-radius: var(--radius); padding: 36px;
    border: 1px solid var(--border); text-align: center;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .user-code {
    font-family: "SF Mono", "Fira Code", monospace; font-size: 32px;
    font-weight: 600; letter-spacing: 2px; color: var(--success);
    background: var(--bg); border-radius: var(--radius); padding: 20px;
    border: 1px solid var(--border); margin-bottom: 24px;
    user-select: all;
  }
  .btn {
    width: 100%; padding: 14px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .hint { font-size: 13px; color: var(--text-muted); margin-top: 16px; line-height: 1.6; }
  .success { color: var(--success); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>设备授权</h1>
    <p class="subtitle">使用 GitHub 账号登录以授权此设备加入你的网络</p>

    <!-- Pending: show code + login button -->
    <div id="pending-view">
      <div class="user-code" id="user-code">...</div>
      <button class="btn btn-primary" id="authorize-btn">使用 GitHub 登录授权</button>
      <p class="hint">点击按钮后将在新页面完成 GitHub 授权。<br>授权成功后此设备将自动连接。</p>
    </div>

    <!-- Approved: show success -->
    <div id="approved-view" class="hidden">
      <div style="font-size:48px;margin-bottom:16px">✓</div>
      <h1 class="success">授权成功</h1>
      <p class="hint">设备已获得授权，可以关闭此页面。<br>请返回 Nebflow 客户端查看连接状态。</p>
    </div>

    <!-- Error -->
    <div id="error-view" class="hidden">
      <div style="font-size:48px;margin-bottom:16px;color:var(--danger)">✕</div>
      <h1 style="color:var(--danger)">授权失败</h1>
      <p class="hint" id="error-msg"></p>
    </div>
  </div>
</div>
<script>
// Extract user_code from the URL path: /device/XXXX-XXXX
const path = window.location.pathname;
const match = path.match(/\/device\/(.+)$/);
const userCode = match ? decodeURIComponent(match[1]) : '';

// Check ?status=approved query param (set by the OAuth callback redirect).
const params = new URLSearchParams(window.location.search);
if (params.get('status') === 'approved') {
  document.getElementById('pending-view').classList.add('hidden');
  document.getElementById('approved-view').classList.remove('hidden');
} else if (!userCode) {
  document.getElementById('pending-view').classList.add('hidden');
  document.getElementById('error-view').classList.remove('hidden');
  document.getElementById('error-msg').textContent = 'URL 中缺少设备授权码。';
} else {
  // Show the user code and wire the button.
  document.getElementById('user-code').textContent = userCode;
  document.getElementById('authorize-btn').addEventListener('click', () => {
    // Start the GitHub OAuth flow with the user_code bound to the state.
    window.location.href = '/api/auth/github/login?user_code=' + encodeURIComponent(userCode);
  });
}
</script>
</body>
</html>
