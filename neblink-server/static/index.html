<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NebLink Server</title>
<style>
  :root {
    --bg: #0f0f17;
    --surface: #1a1a2e;
    --surface-hover: #22223a;
    --border: #2d2d4a;
    --text: #e4e4ef;
    --text-muted: #8888aa;
    --primary: #7c5cfc;
    --primary-hover: #6a4de0;
    --danger: #e0556a;
    --success: #4ecdc4;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 640px; width: 100%; }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px;
    border: 1px solid var(--border);
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--bg); border-radius: 8px; padding: 4px; }
  .tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 6px;
    cursor: pointer; font-size: 14px; color: var(--text-muted);
    transition: all 0.2s; border: none; background: none; font-family: inherit;
  }
  .tab.active { background: var(--primary); color: white; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 15px; font-family: inherit;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: var(--primary); }
  .btn {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 6px; width: auto; }
  .error {
    background: rgba(224,85,106,0.1); color: var(--danger);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .user-info { font-size: 13px; color: var(--text-muted); }
  .net-card {
    background: var(--bg); border-radius: var(--radius); padding: 20px;
    margin-bottom: 12px; border: 1px solid var(--border);
    transition: border-color 0.2s; cursor: pointer;
  }
  .net-card:hover { border-color: var(--primary); }
  .net-name { font-weight: 600; font-size: 16px; }
  .net-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
  }
  .badge-online { background: rgba(78,205,196,0.15); color: var(--success); }
  .badge-offline { background: rgba(136,136,170,0.15); color: var(--text-muted); }
  .device-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .device-row:last-child { border-bottom: none; }
  .device-name { font-weight: 500; font-size: 14px; }
  .device-platform { font-size: 12px; color: var(--text-muted); }
  .actions { display: flex; gap: 8px; }
  .config-snippet {
    background: var(--bg); border-radius: 8px; padding: 16px;
    font-family: "SF Mono", "Fira Code", monospace; font-size: 13px;
    color: var(--success); white-space: pre-wrap; word-break: break-all;
    border: 1px solid var(--border); position: relative;
  }
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    padding: 4px 10px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--primary); }
  .section { margin-top: 24px; }
  .back-link { color: var(--primary); cursor: pointer; font-size: 14px; margin-bottom: 16px; display: inline-block; }
  .empty { text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">

  <!-- ===== Auth View ===== -->
  <div id="auth-view" class="card">
    <h1>NebLink Server</h1>
    <p class="subtitle">设备发现与组网服务</p>
    <div id="auth-error"></div>
    <button class="btn btn-primary" onclick="loginViaNebflow()">通过 nebflow.space 登录</button>
  </div>

  <!-- ===== Dashboard View ===== -->
  <div id="dashboard-view" class="hidden">
    <div class="card">
      <div class="header">
        <div>
          <h1>NebLink Server</h1>
          <p class="user-info">已登录: <span id="display-username"></span></p>
        </div>
        <button class="btn btn-sm" onclick="logout()" style="background:var(--border)">退出</button>
      </div>
      <div id="dashboard-error"></div>
      <h2>网络</h2>
      <div id="networks"></div>
      <div class="section">
        <button class="btn btn-primary btn-sm" onclick="createNetwork()">+ 创建网络</button>
      </div>
    </div>
  </div>

  <!-- ===== Network Detail View ===== -->
  <div id="detail-view" class="hidden">
    <div class="card">
      <span class="back-link" onclick="showDashboard()">← 返回网络列表</span>
      <h2 id="detail-title"></h2>
      <div id="detail-error"></div>

      <div class="section">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">设备配置（复制到 ~/.nebflow/neblink/config.json）</label>
        <div class="config-snippet" id="config-snippet">
          <button class="copy-btn" onclick="copyConfig()">复制</button>
          <span id="config-text"></span>
        </div>
      </div>

      <div class="section">
        <h2 style="font-size:15px">在线设备</h2>
        <div id="devices"></div>
      </div>

      <div class="section">
        <div class="actions">
          <button class="btn btn-sm" style="background:var(--border)" onclick="rotateSecret()">轮换密钥</button>
          <button class="btn btn-danger btn-sm" onclick="deleteNetwork()">删除网络</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const API = '';
let token = localStorage.getItem('neblink_token') || '';
let currentUser = localStorage.getItem('neblink_user') || '';
let currentNetworkId = '';
let currentNetworkName = '';
let currentSecret = '';

// ===== Init: check URL for token from nebflow.space redirect =====
(function() {
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  if (urlToken) {
    token = urlToken;
    localStorage.setItem('neblink_token', token);
    // Clean URL: remove ?token=xxx
    const cleanUrl = window.location.origin + window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);
  }
})();

if (token) showDashboard(); else showAuth();

// ===== Auth =====
function loginViaNebflow() {
  const redirect = window.location.origin;
  window.location.href = 'https://nebflow.space/login?redirect=' + encodeURIComponent(redirect);
}

function showAuthError(msg) {
  document.getElementById('auth-error').innerHTML = '<div class="error">' + msg + '</div>';
}

function logout() {
  token = ''; currentUser = '';
  localStorage.removeItem('neblink_token');
  localStorage.removeItem('neblink_user');
  showAuth();
}

// ===== Views =====
function showAuth() {
  document.getElementById('auth-view').classList.remove('hidden');
  document.getElementById('dashboard-view').classList.add('hidden');
  document.getElementById('detail-view').classList.add('hidden');
}

async function showDashboard() {
  document.getElementById('auth-view').classList.add('hidden');
  document.getElementById('dashboard-view').classList.remove('hidden');
  document.getElementById('detail-view').classList.add('hidden');
  // Fetch user info
  try {
    const resp = await fetch(API + '/api/user/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (resp.status === 403) { logout(); return; }
    const data = await resp.json();
    currentUser = data.email || data.userId;
    localStorage.setItem('neblink_user', currentUser);
  } catch (e) {
    // keep cached user
  }
  document.getElementById('display-username').textContent = currentUser;
  loadNetworks();
}

function showDetail(networkId, networkName, secret) {
  currentNetworkId = networkId;
  currentNetworkName = networkName;
  currentSecret = secret;
  document.getElementById('dashboard-view').classList.add('hidden');
  document.getElementById('detail-view').classList.remove('hidden');
  document.getElementById('detail-title').textContent = networkName;

  // Build config snippet
  const cfg = JSON.stringify({
    enabled: true,
    syncIntervalSec: 60,
    neblinkServer: {
      url: location.origin,
      networkId: networkId,
      secret: secret
    }
  }, null, 2);
  document.getElementById('config-text').textContent = cfg;

  loadDevices();
}

// ===== Networks =====
async function loadNetworks() {
  try {
    const resp = await fetch(API + '/api/network/list', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (resp.status === 403) { logout(); return; }
    const networks = await resp.json();
    const container = document.getElementById('networks');

    if (networks.length === 0) {
      container.innerHTML = '<div class="empty">还没有网络，点击下方按钮创建</div>';
      return;
    }

    container.innerHTML = networks.map(n => `
      <div class="net-card" onclick="showDetail('${n.networkId}', '${escapeHtml(n.name)}', '')">
        <div class="net-name">${escapeHtml(n.name)}</div>
        <div class="net-meta">
          <span class="badge badge-online">${n.onlineDevices} 台在线</span>
          <span style="margin-left:8px;opacity:0.6">${n.networkId.substring(0,8)}...</span>
        </div>
      </div>
    `).join('');
  } catch (e) {
    showDashboardError('加载失败: ' + e.message);
  }
}

async function createNetwork() {
  const name = prompt('网络名称：', 'My Devices');
  if (!name) return;
  try {
    const resp = await fetch(API + '/api/network/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ name })
    });
    const data = await resp.json();
    if (!resp.ok) return showDashboardError(data.error);
    // Show the new network with secret
    alert('网络创建成功！密钥只显示一次，请在详情页复制配置。');
    loadNetworks();
  } catch (e) {
    showDashboardError('创建失败: ' + e.message);
  }
}

async function deleteNetwork() {
  if (!confirm('确认删除网络？所有设备将被踢除。')) return;
  try {
    const resp = await fetch(`${API}/api/network/${currentNetworkId}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) { const d = await resp.json(); return showDetailError(d.error); }
    showDashboard();
  } catch (e) {
    showDetailError('删除失败: ' + e.message);
  }
}

async function rotateSecret() {
  if (!confirm('轮换密钥将使所有设备掉线，需要重新配置。确认？')) return;
  try {
    const resp = await fetch(`${API}/api/network/${currentNetworkId}/rotate`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await resp.json();
    if (!resp.ok) return showDetailError(data.error);
    alert('新密钥已生成。请更新所有设备的配置。');
    currentSecret = data.secret;
    showDetail(currentNetworkId, currentNetworkName, currentSecret);
  } catch (e) {
    showDetailError('轮换失败: ' + e.message);
  }
}

// ===== Devices =====
async function loadDevices() {
  try {
    const resp = await fetch(`${API}/api/network/${currentNetworkId}/devices`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const devices = await resp.json();
    const container = document.getElementById('devices');

    if (devices.length === 0) {
      container.innerHTML = '<div class="empty">暂无设备。将上方配置写入设备的 ~/.nebflow/neblink/config.json 并重启 Nebflow。</div>';
      return;
    }

    container.innerHTML = devices.map(d => `
      <div class="device-row">
        <div>
          <div class="device-name">${escapeHtml(d.deviceName)}</div>
          <div class="device-platform">${escapeHtml(d.platform)} · ${d.deviceId.substring(0,8)}...</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="badge ${d.online ? 'badge-online' : 'badge-offline'}">${d.online ? '在线' : '离线'}</span>
          <button class="btn btn-danger btn-sm" onclick="revokeDevice('${d.deviceId}', '${escapeHtml(d.deviceName)}')">踢除</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    showDetailError('加载设备失败: ' + e.message);
  }
}

async function revokeDevice(deviceId, name) {
  if (!confirm(`确认踢除设备 "${name}"？`)) return;
  try {
    const resp = await fetch(`${API}/api/network/${currentNetworkId}/devices/${deviceId}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) { const d = await resp.json(); return showDetailError(d.error); }
    loadDevices();
  } catch (e) {
    showDetailError('操作失败: ' + e.message);
  }
}

// ===== Helpers =====
function copyConfig() {
  const text = document.getElementById('config-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 2000);
  });
}

function showDashboardError(msg) {
  document.getElementById('dashboard-error').innerHTML = '<div class="error">' + msg + '</div>';
  setTimeout(() => document.getElementById('dashboard-error').innerHTML = '', 3000);
}

function showDetailError(msg) {
  document.getElementById('detail-error').innerHTML = '<div class="error">' + msg + '</div>';
  setTimeout(() => document.getElementById('detail-error').innerHTML = '', 3000);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>
