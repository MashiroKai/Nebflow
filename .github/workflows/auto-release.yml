name: Auto Release

on:
  push:
    branches: [release]

permissions:
  contents: write

env:
  SBT_OPTS: "-Xms512m -Xmx2g"
  COURSIER_REPOSITORIES: "ivy2Local|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2"

jobs:
  build-jar:
    name: Build & Test (jar)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "  Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          if git tag -l | grep -q "^v${{ steps.version.outputs.version }}$"; then
            echo "  Tag v${{ steps.version.outputs.version }} already exists — skipping"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skipped == 'false'
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup sbt
        if: steps.check.outputs.skipped == 'false'
        shell: bash
        run: |
          curl -fL "https://maven.aliyun.com/repository/central/org/scala-sbt/sbt-launch/1.10.10/sbt-launch-1.10.10.jar" -o /tmp/sbt-launch.jar
          mkdir -p /tmp/sbt-bin
          printf '#!/bin/bash\nexec java $SBT_OPTS -XX:+UseParallelGC -jar /tmp/sbt-launch.jar "$@"\n' > /tmp/sbt-bin/sbt
          chmod +x /tmp/sbt-bin/sbt
          echo "/tmp/sbt-bin" >> $GITHUB_PATH

      - name: Run tests
        if: steps.check.outputs.skipped == 'false'
        run: sbt test

      - name: Build assembly
        if: steps.check.outputs.skipped == 'false'
        run: sbt assembly

      - name: Upload jar artifact
        if: steps.check.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2/nebflow-assembly-*.jar
          if-no-files-found: error

  package-macos:
    name: Package macOS (${{ matrix.label }})
    needs: build-jar
    if: needs.build-jar.outputs.skipped == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runs-on: macos-15
          - label: x64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build dmg (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-dmg.sh --jar-dir target/scala-3.5.2

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: build/dist/*.dmg
          if-no-files-found: error

  package-windows:
    name: Package Windows (x64 msi)
    needs: build-jar
    if: needs.build-jar.outputs.skipped == 'false'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # WiX 3.x is a hard dependency of jpackage msi. WiX 3.14 pairs with
      # JDK <= 23 (JDK 24+ switches to WiX 4/5) — keep this in sync with the
      # packaging JDK version above.
      - name: Install WiX 3.14
        shell: bash
        run: |
          choco install wixtoolset --version=3.14.1.2728 -y
          echo "C:/Program Files (x86)/WiX Toolset v3.14/bin" >> $GITHUB_PATH

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build msi (jlink + jpackage)
        shell: bash
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-msi.sh --jar-dir target/scala-3.5.2

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-x64
          path: build/dist/*.msi
          if-no-files-found: error

  release:
    name: Tag, Release & Mirror
    needs: [build-jar, package-macos, package-windows]
    if: needs.build-jar.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find dist -name 'nebflow-assembly-*.jar' -exec cp {} release-assets/ \;
          find dist -name 'Nebflow-*.dmg' -exec cp {} release-assets/ \;
          find dist -name 'Nebflow-*.msi' -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.build-jar.outputs.version }}"
          git push origin release --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-jar.outputs.version }}"
          files: release-assets/*
          generate_release_notes: true

      - name: Upload to COS (China mirror)
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install coscmd 2>/dev/null
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b nebflow-releases-1411212853 -e cos.accelerate.myqcloud.com
          for f in release-assets/*; do
            coscmd upload "$f" "$(basename "$f")" -f
            echo "  Uploaded $(basename "$f") to COS"
          done
          echo -n "${{ needs.build-jar.outputs.version }}" > /tmp/latest-version.txt
          coscmd upload /tmp/latest-version.txt latest-version.txt -f
          echo "  Uploaded latest-version.txt to COS"

      # --- Sync version back to main ---

      - name: Sync version to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          NEW_VERSION="${{ needs.build-jar.outputs.version }}"
          SHA=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.sha')
          ENCODED=$(printf '%s' "$NEW_VERSION" | base64)
          gh api "repos/$REPO/contents/VERSION" \
            -X PUT \
            -f message="chore: sync version to $NEW_VERSION after release" \
            -f content="$ENCODED" \
            -f sha="$SHA" \
            --silent
          echo "  Synced $NEW_VERSION back to main"
