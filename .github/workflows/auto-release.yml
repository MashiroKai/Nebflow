name: Auto Release

# ============================================================================
# DESKTOP PACKAGING FROZEN (2026-09-06, script-install-release v2 batch 5)
# Same sealing as release.yml: the three `package-*` jobs are disabled via
# `if: false` (NOT deleted; restore = remove one line per job), the `release`
# job's needs is narrowed to build-jar, and asset collection is jar-only.
# The workflow_dispatch dry_run mode is KEPT for the certificate-era restore:
# once the `if: false` lines are removed, dry_run=true exercises the full
# packaging matrix (build+test+packagers) without tag/release/COS side
# effects — the pre-flight validator for unsealing.
# See the desktop trust-chain / ICP filing design note for restore gates.
# ============================================================================

on:
  push:
    branches: [release/stable]
  workflow_dispatch:
    # #437: pollution-free E2E verification of the packaging matrix — dry_run
    # (default) runs build+test+all three packagers but SKIPS tag/release/
    # COS. Set dry_run=false only for a real release-equivalent
    # run on a repo where that is intended.
    inputs:
      dry_run:
        description: 'Skip tag/release/COS (verification only)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  SBT_OPTS: "-Xms512m -Xmx3g"
  COURSIER_REPOSITORIES: "ivy2Local|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2"

jobs:
  static:
    name: Static quality gates
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked tooling
        run: npm ci
      - name: Checkout-only static registry
        run: npm run check:static
      - name: Official OpenSpec validation
        if: ${{ !cancelled() }}
        run: npm run check:openspec -- --download
      - name: Explicit-base SDD coverage
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ && ! "$PR_BASE" =~ ^0+$ ]]
            base="$PR_BASE"
          else
            base="${PUSH_BEFORE:-}"
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]]; then
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base"
          else
            test -n "$DEFAULT_BRANCH"
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            base=$(git merge-base HEAD FETCH_HEAD)
          fi
          git cat-file -e "$base^{commit}"
          npm run check:sdd-changed -- --base "$base"

  build-jar:
    name: Build & Test (jar)
    needs: static
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brand values from brand.conf
        # L2 rebrand: single source — every brand string below flows from here.
        run: |
          bv() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" brand.conf | sed 's/[[:space:]]#.*$//; s/[[:space:]]*$//' | head -1; }
          echo "LOWER_NAME=$(bv lowerName)" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$(bv productName)" >> $GITHUB_ENV
          echo "COS_BUCKET=$(bv cosBucket)" >> $GITHUB_ENV
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "  Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          if git tag -l | grep -q "^${{ steps.version.outputs.version }}$"; then
            echo "  Tag ${{ steps.version.outputs.version }} already exists — skipping"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skipped == 'false'
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        if: steps.check.outputs.skipped == 'false'
        shell: bash
        run: |
          curl -fL "https://maven.aliyun.com/repository/central/org/scala-sbt/sbt-launch/1.10.10/sbt-launch-1.10.10.jar" -o /tmp/sbt-launch.jar
          mkdir -p /tmp/sbt-bin
          printf '#!/bin/bash\nexec java $SBT_OPTS -XX:+UseParallelGC -jar /tmp/sbt-launch.jar "$@"\n' > /tmp/sbt-bin/sbt
          chmod +x /tmp/sbt-bin/sbt
          echo "/tmp/sbt-bin" >> $GITHUB_PATH

      - name: Install ripgrep (Glob/Grep runtime dependency)
        if: steps.check.outputs.skipped == 'false'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tests
        if: steps.check.outputs.skipped == 'false'
        run: sbt test

      - name: Setup Node.js
        if: steps.check.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build web bundle (P1)
        if: steps.check.outputs.skipped == 'false'
        # Same chain as ci.yml's assembly job: esbuild bundle -> build/web-dist,
        # mounted into the jar by `-D${LOWER_NAME}.webdist=1` below. Without
        # this step the shipped jar falls back to the SOURCE tree
        # (WebSocketRoutes: web-dist/index.html missing -> serve web/), i.e. the
        # release artifact was never the built tree. Friends ship UNSEALED
        # (author ruling 2026-09-14, D1②); build-web.mjs keeps stripping as an
        # opt-in switch — add `--strip-friends` to re-seal.
        run: |
          npm ci
          node scripts/build-web.mjs

      - name: Build assembly
        if: steps.check.outputs.skipped == 'false'
        # -D<lowerName>.webdist=1 mounts build/web-dist into the jar (opt-in so
        # a dev machine's plain `sbt run` never serves a stale dist tree).
        run: sbt -D${LOWER_NAME}.webdist=1 assembly

      - name: Upload jar artifact
        if: steps.check.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2/${{ env.LOWER_NAME }}-assembly-*.jar
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: E2E release gate (full functional)
    # 发布前全量门禁（作者裁定 2026-11-16 11:54：E2E harness 合入 main 6dc48c6d7
    # 后接入发布线——「全量测试安排在发布前 CI/CD」）。任一红即中止发布：
    # release job needs 本 job。日常开发不跑全量（定向跑见 references/qa/e2e-testing.md）。
    # 拓扑：自托管 Mac（ci-selfhosted 先例）——harness fail-closed 依赖 seatbelt
    # (sandbox-exec 正负对照)、$E2E_CACHE_HOME/.stand/bin/sbt 门禁包装器、JDK23 与
    # 依赖缓存，GitHub 托管 runner 均不满足；自托管分钟不计费（作者令 2026-10-21）。
    # 双文件同步维护（沿 build-jar 双份先例）：release.yml / auto-release.yml。
    # dry_run dispatch 时本 job 照跑（验证无发布副作用）。
    needs: build-jar
    if: needs.build-jar.outputs.skipped == 'false'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 75
    env:
      # 源钉：钉 readiness 批新 sha；clone 后 rev-parse 相等校验，漂移即红。
      STAND_DEV_REF: 6368e13fa587c5d2f998a35f39476ebdc8562e7f
      # 门禁语义裁定点（集中一处，--list 与执行共用；两文件同步改）：
      # --suite functional --full = 场景目录全量枚举（E02–E10 落地自动纳入）。
      E2E_SUITE_ARGS: "--suite functional --full"
      # 就绪感知开关（作者裁定 2026-11-16：只跑已实现场景；READY 失败=红，
      # NOT READY=跳过+显式列出，--list 带 readiness 列）。
      E2E_READINESS_FLAG: "--require-ready"
      # github.com 直连不稳（ci-selfhosted 2026-10-21 实测）：checkout 走本机代理；
      # aliyun/npmmirror 腿不受影响。沙箱内子进程环境由 harness 全新构造，不继承。
      https_proxy: "http://127.0.0.1:7890"
      http_proxy: "http://127.0.0.1:7890"
    steps:
      - uses: actions/checkout@v4
        with:
          # adapter 源钉 merge-base HEAD BASELINE（isolated_harness.py）与套件
          # fingerprint 都要完整历史 —— 全量检出。
          fetch-depth: 0

      - name: Detect JDK23 (java-home 探测，不硬编码本机路径)
        # Same logic locally: /usr/libexec/java_home -v 23
        shell: bash
        run: |
          if ! E2E_JAVA_HOME="$(/usr/libexec/java_home -v 23)"; then
            echo "::error::JDK23 not found (/usr/libexec/java_home -v 23 failed)"
            exit 1
          fi
          "$E2E_JAVA_HOME/bin/java" -version 2>&1 | head -2
          echo "E2E_JAVA_HOME=$E2E_JAVA_HOME" >> "$GITHUB_ENV"

      - name: Resolve cache-home (gate wrapper assert)
        # Same logic locally: test -x "${E2E_CACHE_HOME:-$HOME}/.stand/bin/sbt"
        shell: bash
        run: |
          E2E_CACHE_HOME="${E2E_CACHE_HOME:-$HOME}"
          if [ ! -x "$E2E_CACHE_HOME/.stand/bin/sbt" ]; then
            echo "::error::gate sbt wrapper missing: $E2E_CACHE_HOME/.stand/bin/sbt"
            exit 1
          fi
          echo "E2E_CACHE_HOME=$E2E_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Clone pinned stand-dev harness
        # Same logic locally:
        #   git clone git@git.ustc.edu.cn:kaiyu/stand-dev.git /tmp/stand-dev-harness
        #   git -C /tmp/stand-dev-harness checkout "$STAND_DEV_REF"
        shell: bash
        run: |
          H="$RUNNER_TEMP/stand-dev-harness"
          rm -rf "$H"
          git clone --quiet git@git.ustc.edu.cn:kaiyu/stand-dev.git "$H"
          git -C "$H" checkout --quiet "$STAND_DEV_REF"
          if [ "$(git -C "$H" rev-parse HEAD)" != "$STAND_DEV_REF" ]; then
            echo "::error::harness pin drift (expected $STAND_DEV_REF)"
            exit 1
          fi
          test -x "$H/skills/stand-dev/scripts/isolated_harness.py"
          echo "HARNESS=$H/skills/stand-dev" >> "$GITHUB_ENV"

      - name: E2E plan (list = dry-run 原语)
        # Same logic locally:
        #   python3 ~/.stand/plugins/stand-dev/skills/stand-dev/scripts/run_e2e.py \
        #     --suite functional --full --list
        shell: bash
        run: python3 "$HARNESS/scripts/run_e2e.py" $E2E_SUITE_ARGS $E2E_READINESS_FLAG --list

      - name: Warm dependency caches (cache-home 自举，在线)
        # Same logic locally（门禁 sbt，会话权限外 → 作者代跑）:
        #   JAVA_HOME="$(/usr/libexec/java_home -v 23)" SBT_GATE=on SBT_GATE_SERIALIZE=on \
        #     "$HOME/.stand/bin/sbt" -batch compile e2eClasspath
        # 门禁包装器走全局锁（~/.stand/run/sbt.lock），与作者本机 sbt 互斥安全；
        # 在线解析依赖落入 cache-home，供下一步离线沙箱编译只读拷贝。
        shell: bash
        run: |
          env JAVA_HOME="$E2E_JAVA_HOME" SBT_GATE=on SBT_GATE_SERIALIZE=on \
            "$E2E_CACHE_HOME/.stand/bin/sbt" -batch compile e2eClasspath

      - name: Build E2E fixture (offline sandboxed compile)
        # Same logic locally（含 sbt → 作者代跑）:
        #   python3 ~/.stand/plugins/stand-dev/skills/stand-dev/scripts/build_e2e_fixture.py \
        #     --repo . --output /tmp/e2e-fixture-<ts> \
        #     --java-home "$(/usr/libexec/java_home -v 23)" --cache-home "$HOME"
        shell: bash
        run: |
          E2E_FIXTURE="$RUNNER_TEMP/e2e-fixture-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "E2E_FIXTURE=$E2E_FIXTURE" >> "$GITHUB_ENV"
          python3 "$HARNESS/scripts/build_e2e_fixture.py" \
            --repo "$GITHUB_WORKSPACE" --output "$E2E_FIXTURE" \
            --java-home "$E2E_JAVA_HOME" --cache-home "$E2E_CACHE_HOME"

      - name: Run full functional E2E suite (fail-closed)
        # Same logic locally:
        #   python3 ~/.stand/plugins/stand-dev/skills/stand-dev/scripts/run_e2e.py \
        #     --suite functional --full --repo . --output /tmp/e2e-results-<ts> \
        #     --adapter ~/.stand/plugins/stand-dev/skills/stand-dev/scripts/isolated_harness.py
        # 任一场景 FAIL/NOT READY → 非零 → 发布中止（语义由 E2E_SUITE_ARGS 定）。
        shell: bash
        run: |
          E2E_OUT="$RUNNER_TEMP/e2e-results-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "E2E_OUT=$E2E_OUT" >> "$GITHUB_ENV"
          python3 "$HARNESS/scripts/run_e2e.py" $E2E_SUITE_ARGS $E2E_READINESS_FLAG \
            --repo "$GITHUB_WORKSPACE" --output "$E2E_OUT" \
            --adapter "$HARNESS/scripts/isolated_harness.py"

      - name: Frontend gate (check:frontend)
        # Same logic locally:
        #   npm ci && npm install --no-save @playwright/test@1.62.0 && npm run check:frontend
        # playwright 不入 devDependencies（仓规「由运行环境自带」；visual-harness.mjs
        # 解析顺序注释的 CI 形态 = npm install --no-save @playwright/test）。
        # 1.62.0 = 运行环境配对版本（2026-11-16 实证 25/25）；浏览器缺缓存时
        # 退回系统 Edge/Chrome（visual-harness.mjs executablePath 顺序）。
        shell: bash
        run: |
          npm ci
          npm install --no-save @playwright/test@1.62.0
          npm run check:frontend

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/e2e-*
          if-no-files-found: warn
          retention-days: 3

  package-macos:
    name: Package macOS (${{ matrix.label }})
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runs-on: macos-15
          - label: x64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build dmg (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-dmg.sh --jar-dir target/scala-3.5.2

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: build/dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  package-windows:
    name: Package Windows (x64 msi)
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # WiX 3.x is a hard dependency of jpackage msi. Runner images may ship a
      # newer WiX 3.14.x preinstalled — install pinned version only if the
      # toolset is absent (choco refuses downgrade without --allow-downgrade).
      - name: Install WiX 3.14
        shell: bash
        run: |
          if [ ! -f "C:/Program Files (x86)/WiX Toolset v3.14/bin/candle.exe" ]; then
            choco install wixtoolset --version=3.14.1.2728 -y
          fi
          echo "C:/Program Files (x86)/WiX Toolset v3.14/bin" >> $GITHUB_PATH

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build msi (jlink + jpackage)
        shell: bash
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-msi.sh --jar-dir target/scala-3.5.2

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-x64
          path: build/dist/*.msi
          if-no-files-found: error
          retention-days: 3

  package-linux:
    name: Package Linux (deb + app-image)
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # jpackage's LinuxDebBundler hard-depends on dpkg/dpkg-deb/fakeroot
      # (research §5). dpkg ships with Ubuntu; fakeroot is explicit for safety.
      - name: Install deb toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build deb + app-image (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-linux.sh --jar-dir target/scala-3.5.2

      - name: Upload deb + app-image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/dist/*.deb
            build/dist/*-app-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    name: Tag, Release & Mirror
    # [FROZEN 2026-09-06] needs narrowed to build-jar (package-* jobs sealed)
    # 2026-11-16: needs widened to [build-jar, e2e] — 发布前全量 E2E 门禁
    # （作者裁定）阻塞 tag/release；dry_run dispatch 时跳过发布副作用。
    needs: [build-jar, e2e]
    if: needs.build-jar.outputs.skipped == 'false' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Brand values from brand.conf
        # L2 rebrand: single source — every brand string below flows from here.
        run: |
          bv() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" brand.conf | sed 's/[[:space:]]#.*$//; s/[[:space:]]*$//' | head -1; }
          echo "LOWER_NAME=$(bv lowerName)" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$(bv productName)" >> $GITHUB_ENV
          echo "COS_BUCKET=$(bv cosBucket)" >> $GITHUB_ENV
      - name: Collect assets
        run: |
          # [FROZEN 2026-09-06] jar-only contract (desktop asset patterns
          # sealed — see header comment; restore = re-add the four find lines
          # for dmg/msi/deb/app-image)
          mkdir -p release-assets
          find dist -name "${LOWER_NAME}-assembly-*.jar" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          # Empty release = silent failure (jar pattern above is the contract)
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::no release assets collected — pattern/brand mismatch"
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.build-jar.outputs.version }}"
          git push origin "refs/tags/${{ needs.build-jar.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.build-jar.outputs.version }}"
          files: release-assets/*
          generate_release_notes: true

      - name: Upload to OSS (China mirror)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "::warning::OSS secrets absent — China mirror NOT updated (GitHub Release is the primary source)"
            exit 0
          fi
          # Object-storage switch 2026-09-14: pinned ossutil release (zip sha256
          # dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343).
          curl -fsSL -o /tmp/ossutil.zip "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -q -j -o /tmp/ossutil.zip -d /tmp/ossutil-bin
          OSSUTIL=/tmp/ossutil-bin/ossutil64
          chmod +x "$OSSUTIL"
          "$OSSUTIL" config -e oss-cn-hangzhou.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L EN
          for f in release-assets/*; do
            "$OSSUTIL" cp "$f" "oss://$COS_BUCKET/$(basename "$f")" -f
            echo "  Uploaded $(basename "$f") to OSS"
          done
          echo -n "${{ needs.build-jar.outputs.version }}" > /tmp/latest-version.txt
          "$OSSUTIL" cp /tmp/latest-version.txt "oss://$COS_BUCKET/latest-version.txt" -f
          echo "  Uploaded latest-version.txt to OSS"
