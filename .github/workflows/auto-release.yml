name: Auto Release

# ============================================================================
# DESKTOP PACKAGING FROZEN (2026-09-06, script-install-release v2 batch 5)
# Same sealing as release.yml: the three `package-*` jobs are disabled via
# `if: false` (NOT deleted; restore = remove one line per job), the `release`
# job's needs is narrowed to build-jar, and asset collection is jar-only.
# The workflow_dispatch dry_run mode is KEPT for the certificate-era restore:
# once the `if: false` lines are removed, dry_run=true exercises the full
# packaging matrix (build+test+packagers) without tag/release/COS side
# effects — the pre-flight validator for unsealing.
# See the desktop trust-chain / ICP filing design note for restore gates.
# ============================================================================

on:
  push:
    branches: [release]
  workflow_dispatch:
    # #437: pollution-free E2E verification of the packaging matrix — dry_run
    # (default) runs build+test+all three packagers but SKIPS tag/release/
    # COS/version-sync. Set dry_run=false only for a real release-equivalent
    # run on a repo where that is intended.
    inputs:
      dry_run:
        description: 'Skip tag/release/COS/version-sync (verification only)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  SBT_OPTS: "-Xms512m -Xmx3g"
  COURSIER_REPOSITORIES: "ivy2Local|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2"

jobs:
  build-jar:
    name: Build & Test (jar)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brand values from brand.conf
        # L2 rebrand: single source — every brand string below flows from here.
        run: |
          bv() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" brand.conf | sed 's/[[:space:]]#.*$//; s/[[:space:]]*$//' | head -1; }
          echo "LOWER_NAME=$(bv lowerName)" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$(bv productName)" >> $GITHUB_ENV
          echo "COS_BUCKET=$(bv cosBucket)" >> $GITHUB_ENV
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "  Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          if git tag -l | grep -q "^v${{ steps.version.outputs.version }}$"; then
            echo "  Tag v${{ steps.version.outputs.version }} already exists — skipping"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skipped == 'false'
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        if: steps.check.outputs.skipped == 'false'
        shell: bash
        run: |
          curl -fL "https://maven.aliyun.com/repository/central/org/scala-sbt/sbt-launch/1.10.10/sbt-launch-1.10.10.jar" -o /tmp/sbt-launch.jar
          mkdir -p /tmp/sbt-bin
          printf '#!/bin/bash\nexec java $SBT_OPTS -XX:+UseParallelGC -jar /tmp/sbt-launch.jar "$@"\n' > /tmp/sbt-bin/sbt
          chmod +x /tmp/sbt-bin/sbt
          echo "/tmp/sbt-bin" >> $GITHUB_PATH

      - name: Install ripgrep (Glob/Grep runtime dependency)
        if: steps.check.outputs.skipped == 'false'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tests
        if: steps.check.outputs.skipped == 'false'
        run: sbt test

      - name: Setup Node.js
        if: steps.check.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build web bundle (P1)
        if: steps.check.outputs.skipped == 'false'
        # Same chain as ci.yml's assembly job: esbuild bundle -> build/web-dist,
        # mounted into the jar by `-D${LOWER_NAME}.webdist=1` below. Without
        # this step the shipped jar falls back to the SOURCE tree
        # (WebSocketRoutes: web-dist/index.html missing -> serve web/), i.e. the
        # release artifact was never the built tree. Friends ship UNSEALED
        # (author ruling 2026-09-14, D1②); build-web.mjs keeps stripping as an
        # opt-in switch — add `--strip-friends` to re-seal.
        run: |
          npm ci
          node scripts/build-web.mjs

      - name: Build assembly
        if: steps.check.outputs.skipped == 'false'
        # -D<lowerName>.webdist=1 mounts build/web-dist into the jar (opt-in so
        # a dev machine's plain `sbt run` never serves a stale dist tree).
        run: sbt -D${LOWER_NAME}.webdist=1 assembly

      - name: Upload jar artifact
        if: steps.check.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2/${{ env.LOWER_NAME }}-assembly-*.jar
          if-no-files-found: error
          retention-days: 3

  package-macos:
    name: Package macOS (${{ matrix.label }})
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runs-on: macos-15
          - label: x64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build dmg (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-dmg.sh --jar-dir target/scala-3.5.2

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: build/dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  package-windows:
    name: Package Windows (x64 msi)
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # WiX 3.x is a hard dependency of jpackage msi. Runner images may ship a
      # newer WiX 3.14.x preinstalled — install pinned version only if the
      # toolset is absent (choco refuses downgrade without --allow-downgrade).
      - name: Install WiX 3.14
        shell: bash
        run: |
          if [ ! -f "C:/Program Files (x86)/WiX Toolset v3.14/bin/candle.exe" ]; then
            choco install wixtoolset --version=3.14.1.2728 -y
          fi
          echo "C:/Program Files (x86)/WiX Toolset v3.14/bin" >> $GITHUB_PATH

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build msi (jlink + jpackage)
        shell: bash
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-msi.sh --jar-dir target/scala-3.5.2

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-x64
          path: build/dist/*.msi
          if-no-files-found: error
          retention-days: 3

  package-linux:
    name: Package Linux (deb + app-image)
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # jpackage's LinuxDebBundler hard-depends on dpkg/dpkg-deb/fakeroot
      # (research §5). dpkg ships with Ubuntu; fakeroot is explicit for safety.
      - name: Install deb toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build deb + app-image (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-linux.sh --jar-dir target/scala-3.5.2

      - name: Upload deb + app-image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/dist/*.deb
            build/dist/*-app-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    name: Tag, Release & Mirror
    # [FROZEN 2026-09-06] needs narrowed to build-jar (package-* jobs sealed)
    needs: [build-jar]
    if: needs.build-jar.outputs.skipped == 'false' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Brand values from brand.conf
        # L2 rebrand: single source — every brand string below flows from here.
        run: |
          bv() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" brand.conf | sed 's/[[:space:]]#.*$//; s/[[:space:]]*$//' | head -1; }
          echo "LOWER_NAME=$(bv lowerName)" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$(bv productName)" >> $GITHUB_ENV
          echo "COS_BUCKET=$(bv cosBucket)" >> $GITHUB_ENV
      - name: Collect assets
        run: |
          # [FROZEN 2026-09-06] jar-only contract (desktop asset patterns
          # sealed — see header comment; restore = re-add the four find lines
          # for dmg/msi/deb/app-image)
          mkdir -p release-assets
          find dist -name "${LOWER_NAME}-assembly-*.jar" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          # Empty release = silent failure (jar pattern above is the contract)
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::no release assets collected — pattern/brand mismatch"
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.build-jar.outputs.version }}"
          git push origin release --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-jar.outputs.version }}"
          files: release-assets/*
          generate_release_notes: true

      - name: Upload to OSS (China mirror)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "::warning::OSS secrets absent — China mirror NOT updated (GitHub Release is the primary source)"
            exit 0
          fi
          # Object-storage switch 2026-09-14: pinned ossutil release (zip sha256
          # dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343).
          curl -fsSL -o /tmp/ossutil.zip "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip"
          unzip -q -j -o /tmp/ossutil.zip -d /tmp/ossutil-bin
          OSSUTIL=/tmp/ossutil-bin/ossutil64
          chmod +x "$OSSUTIL"
          "$OSSUTIL" config -e oss-cn-hangzhou.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L EN
          for f in release-assets/*; do
            "$OSSUTIL" cp "$f" "oss://$COS_BUCKET/$(basename "$f")" -f
            echo "  Uploaded $(basename "$f") to OSS"
          done
          echo -n "${{ needs.build-jar.outputs.version }}" > /tmp/latest-version.txt
          "$OSSUTIL" cp /tmp/latest-version.txt "oss://$COS_BUCKET/latest-version.txt" -f
          echo "  Uploaded latest-version.txt to OSS"

      # --- Sync version back to main ---

      - name: Sync version to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          NEW_VERSION="${{ needs.build-jar.outputs.version }}"
          SHA=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.sha')
          ENCODED=$(printf '%s' "$NEW_VERSION" | base64)
          gh api "repos/$REPO/contents/VERSION" \
            -X PUT \
            -f message="chore: sync version to $NEW_VERSION after release" \
            -f content="$ENCODED" \
            -f sha="$SHA" \
            --silent
          echo "  Synced $NEW_VERSION back to main"
