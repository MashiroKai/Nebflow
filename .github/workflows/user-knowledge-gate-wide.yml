name: User Knowledge Gate (wide, pre-public)

# =====================================================================
# 宽口径用户知识泄漏门禁——**默认不启用**（仅 workflow_dispatch 手动触发）。
#
# 为什么默认不启用：
#   - 私有仓 Actions 烧免费额度，公开后免费（仓库转公开后此限制消失）。
#   - 当前 main 仍存在若干非测试路径的 [leak] 命中（AGENTS.md /Users/dev、
#     REBRAND.md VPS IP、scripts/sandbox-poc 的 USTC 源、staging/dream-run
#     报告等），若自动触发会使 CI 变红——公开前必须先扫清。
#
# 启用时机（仓库公开后）：
#   1. 先跑 `bash scripts/check-user-knowledge.sh --all`，把非测试路径的
#      [leak] 命中处理成中性示例 / 移出公开仓，确保输出「非测试路径 = 无」。
#   2. 把下面的 `on:` 触发条件从 `workflow_dispatch` 扩展为：
#        push:    { branches: [main] }
#        pull_request: { branches: [main] }
#   3. 保留 `user-knowledge-gate`（src/main 严格门禁）与 `user-knowledge--all`
#      两个 job 一并生效。
#
# 同一逻辑本地可跑：bash scripts/check-user-knowledge.sh --all
# 严格 src/main 门禁（已启用）见 .github/workflows/ci.yml 的 user-knowledge-gate。
# =====================================================================

on:
  workflow_dispatch:   # 仅手动触发；仓库公开并扫清泄漏后再补 push/pull_request

jobs:
  src-main-strict:
    name: User Knowledge Gate (src/main strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan src/main (strict gate, fail-fast)
        run: bash scripts/check-user-knowledge.sh

  repo-all-audit:
    name: User Knowledge Gate (--all pre-public audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan whole repo (--all, pre-public audit)
        run: bash scripts/check-user-knowledge.sh --all
