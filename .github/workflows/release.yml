name: Beta Release

# ============================================================================
# DESKTOP PACKAGING FROZEN (2026-09-06, script-install-release v2 batch 5)
# The three `package-*` jobs are sealed, NOT deleted: unsigned dmg/msi/deb/
# app-image artifacts get users past no Gatekeeper/SmartScreen-sane install,
# so the release line ships script-install only (jar + install.sh/ps1).
# Sealing mechanism: `if: false` on each package job (semantic equivalent of
# comment-disabling, keeps YAML valid and reviewable; restore = remove one
# line per job). The `release` job's `needs` is narrowed to build-jar so the
# jar line (tag / GH Release / COS jar+pointer upload) keeps flowing.
# Restore conditions (see .nebflow/Spec/desktop-trust-and-icp-filing-plan.md):
#   macOS  = Apple Developer ID + CI notarytool/stapler integration
#   Windows = Certum cert + CI signtool/TSA integration (+ SmartScreen warmup)
# Restore actions = drop `if: false`, restore needs list, re-enable the four
# asset patterns in "Collect assets". packaging/ toolchain is frozen in place
# and reused as-is (MinGit/rg bundling, msi marker logic).
# ============================================================================

on:
  push:
    branches: [beta]

permissions:
  contents: write

env:
  SBT_OPTS: "-Xms512m -Xmx2g"
  COURSIER_REPOSITORIES: "ivy2Local|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2"

jobs:
  build-jar:
    name: Build & Test (jar)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brand values from brand.conf
        # L2 rebrand: single source — every brand string below flows from here.
        run: |
          bv() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" brand.conf | sed 's/[[:space:]]#.*$//; s/[[:space:]]*$//' | head -1; }
          echo "LOWER_NAME=$(bv lowerName)" >> $GITHUB_ENV
          echo "COS_BUCKET=$(bv cosBucket)" >> $GITHUB_ENV
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "  Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          # [FIX 2026-09-06] skip-guard race removed: this version's tag is created
          # by the release job itself, so on a re-push of beta the tag already
          # exists and "skip on existing tag" dead-locked the whole build into an
          # empty run (no build / no GH Release / no COS upload). Contract here is
          # "every beta push rebuilds + republishes" — a stale tag is handled
          # idempotently by the release job's "Create tag" (delete-then-create),
          # not by skipping the build. So we never mark skipped.
          TAG_VER="v${{ steps.version.outputs.version }}"
          if git tag -l | grep -q "^${TAG_VER}$"; then
            echo "  Tag ${TAG_VER} already exists — will re-create rather than skip"
          else
            echo "  Tag ${TAG_VER} does not exist yet — will create on release"
          fi
          echo "skipped=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skipped == 'false'
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        if: steps.check.outputs.skipped == 'false'
        shell: bash
        run: |
          curl -fL "https://maven.aliyun.com/repository/central/org/scala-sbt/sbt-launch/1.10.10/sbt-launch-1.10.10.jar" -o /tmp/sbt-launch.jar
          mkdir -p /tmp/sbt-bin
          printf '#!/bin/bash\nexec java $SBT_OPTS -XX:+UseParallelGC -jar /tmp/sbt-launch.jar "$@"\n' > /tmp/sbt-bin/sbt
          chmod +x /tmp/sbt-bin/sbt
          echo "/tmp/sbt-bin" >> $GITHUB_PATH

      - name: Install ripgrep (Glob/Grep runtime dependency)
        if: steps.check.outputs.skipped == 'false'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tests
        if: steps.check.outputs.skipped == 'false'
        run: sbt -Dmunit.failOnFlaky=false test

      - name: Build assembly
        if: steps.check.outputs.skipped == 'false'
        run: sbt assembly

      - name: Upload jar artifact
        if: steps.check.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2/${{ env.LOWER_NAME }}-assembly-*.jar
          if-no-files-found: error

  package-macos:
    name: Package macOS (${{ matrix.label }})
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runs-on: macos-15
          - label: x64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build dmg (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-dmg.sh --jar-dir target/scala-3.5.2

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: build/dist/*.dmg
          if-no-files-found: error

  package-windows:
    name: Package Windows (x64 msi)
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # WiX 3.x is a hard dependency of jpackage msi. Runner images may ship a
      # newer WiX 3.14.x preinstalled — install pinned version only if the
      # toolset is absent (choco refuses downgrade without --allow-downgrade).
      - name: Install WiX 3.14
        shell: bash
        run: |
          if [ ! -f "C:/Program Files (x86)/WiX Toolset v3.14/bin/candle.exe" ]; then
            choco install wixtoolset --version=3.14.1.2728 -y
          fi
          echo "C:/Program Files (x86)/WiX Toolset v3.14/bin" >> $GITHUB_PATH

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build msi (jlink + jpackage)
        shell: bash
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-msi.sh --jar-dir target/scala-3.5.2

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-x64
          path: build/dist/*.msi
          if-no-files-found: error

  package-linux:
    name: Package Linux (deb + app-image)
    needs: build-jar
    if: false # [FROZEN 2026-09-06] desktop packaging sealed — see header comment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # jpackage's LinuxDebBundler hard-depends on dpkg/dpkg-deb/fakeroot
      # (research §5). dpkg ships with Ubuntu; fakeroot is explicit for safety.
      - name: Install deb toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/scala-3.5.2

      - name: Build deb + app-image (jlink + jpackage)
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-linux.sh --jar-dir target/scala-3.5.2

      - name: Upload deb + app-image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/dist/*.deb
            build/dist/*-app-image.tar.gz
          if-no-files-found: error

  release:
    name: Tag, Release & Mirror
    # [FROZEN 2026-09-06] needs narrowed to build-jar (package-* jobs sealed)
    needs: [build-jar]
    if: needs.build-jar.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Brand values from brand.conf
        # L2 rebrand: single source — every brand string below flows from here.
        run: |
          bv() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" brand.conf | sed 's/[[:space:]]#.*$//; s/[[:space:]]*$//' | head -1; }
          echo "LOWER_NAME=$(bv lowerName)" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$(bv productName)" >> $GITHUB_ENV
          echo "COS_BUCKET=$(bv cosBucket)" >> $GITHUB_ENV
      - name: Collect assets
        run: |
          # [FROZEN 2026-09-06] jar-only contract (desktop asset patterns
          # sealed — see header comment; restore = re-add the four find lines
          # for dmg/msi/deb/app-image)
          mkdir -p release-assets
          find dist -name "${LOWER_NAME}-assembly-*.jar" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          # Empty release = silent failure (jar pattern above is the contract)
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::no release assets collected — pattern/brand mismatch"
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          V="v${{ needs.build-jar.outputs.version }}"
          # [FIX 2026-09-06] idempotent re-create: on a re-push of beta the tag for
          # this version already exists on remote (created by a prior run); delete
          # it first (local + remote) so `git tag` and `git push origin beta --tags`
          # don't fail, and the release is rebuilt + republished.
          git tag -d "$V" 2>/dev/null || true
          git push origin ":refs/tags/$V" 2>/dev/null || true
          git tag "$V"
          git push origin beta --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-jar.outputs.version }}"
          files: release-assets/*
          prerelease: true
          generate_release_notes: true

      - name: Upload to COS (China mirror)
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install coscmd 2>/dev/null
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -e cos.accelerate.myqcloud.com
          for f in release-assets/*; do
            coscmd upload "$f" "$(basename "$f")" -f
            echo "  Uploaded $(basename "$f") to COS"
          done
          # Beta channel pointer: latest-beta-version.txt (stable writes latest-version.txt — do not clobber)
          echo -n "${{ needs.build-jar.outputs.version }}" > /tmp/latest-beta-version.txt
          coscmd upload /tmp/latest-beta-version.txt latest-beta-version.txt -f
          echo "  Uploaded latest-beta-version.txt to COS"
