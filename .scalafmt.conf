version = "3.8.6"
runner.dialect = scala3

maxColumn = 120
indent.main = 2
indent.callSite = 2
indent.defnSite = 2

align.preset = none

newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]
newlines.beforeMultilineDef = keep
newlines.alwaysBeforeElseAfterCurlyIf = false

lineEndings = unix

rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
# 0 = 关闭。scalafmt 3.8.6 的 insertEndMarkerMinLines 会给「括号内 for 推导式」
# （`(for ... yield ())`）在右括号**之后**追加一条 `end for`，而 Scala 3.5.2 对这种
# 位置报 `misaligned end marker`（格式化输出不可编译：主源 1 处、测试 10 处，实测）。
# 该 rewrite 的输出位置与编译器接受的位置互斥，故关闭；源码中已手写的 end 标记保留。
rewrite.scala3.insertEndMarkerMinLines = 0

docstrings.style = Asterisk
docstrings.oneline = fold
docstrings.wrap = no

project.git = true
project.excludePaths = [
  "glob:**/target/**"
]
