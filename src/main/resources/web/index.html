  <script>
  /* Anti-recursion guard (canvas-html embedded boot, 2026-08-18). Sandboxed
     HTML previews (Canvas/Card srcdoc iframes) can navigate their frame to the
     app URL — e.g. a slidev deck's hash router resolving against the inherited
     base URL. A nested boot would share localStorage, restore the same canvas
     file tab and re-render the same file → infinite nesting. Classic script so
     it always runs before the module graph; main.js checks the flag and
     refuses to boot. */
  if (window.self !== window.top) document.documentElement.dataset.nfEmbedded = '1';
  </script>

       ?v=4 busts the browser cache for the in-place favicon rewrite — the
       gateway root route only serves a fixed filename whitelist, so the
       favicon-* names cannot change with the artwork. -->

  <script>
  /* Pre-paint Side Bar panel restore (classic script — runs before the module
     graph). The body class was set at parse start; here we resolve the
     persisted active panel so the FIRST FRAME already shows the correct
     panel/button state (no flicker). Unknown persisted ids fall back to
     'files'. Collapsed → nothing is active (activityBar.js re-activates the
     stored panel on expand). */
  (function () {
    var r = window.__sidebarRestore || { collapsed: false, panel: 'files' };
    var panels = document.querySelectorAll('#sidebar-panel .panel');
    var target = null;
    for (var i = 0; i < panels.length; i++) {
      if (panels[i].getAttribute('data-panel-id') === r.panel) target = panels[i];
    }
    if (!target) target = document.querySelector('#sidebar-panel .panel[data-panel-id="files"]');
    for (var j = 0; j < panels.length; j++) {
      panels[j].classList.toggle('active', !r.collapsed && panels[j] === target);
    }
    var pid = target ? target.getAttribute('data-panel-id') : 'files';
    var btn = document.querySelector('#activity-bar [data-panel-btn="' + pid + '"]');
    if (btn) {
      btn.classList.toggle('active', !r.collapsed);
      btn.setAttribute('aria-pressed', r.collapsed ? 'false' : 'true');
    }
  })();
  </script>
