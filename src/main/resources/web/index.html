  <script>
  /* Anti-recursion guard (canvas-html embedded boot, 2026-08-18). Sandboxed
     HTML previews (Canvas/Card srcdoc iframes) can navigate their frame to the
     app URL — e.g. a slidev deck's hash router resolving against the inherited
     base URL. A nested boot would share localStorage, restore the same canvas
     file tab and re-render the same file → infinite nesting. Classic script so
     it always runs before the module graph; main.js checks the flag and
     refuses to boot. */
  if (window.self !== window.top) document.documentElement.dataset.nfEmbedded = '1';
  /* Card-window pre-paint gate (独立窗口内容物收口批, 2026-10-22). ?card-window=1
     means this window must render a single content card ONLY (document / file /
     image viewer) — never the full app shell. The mode class used to be added
     by canvas.js initCardWindowMode(), i.e. only AFTER the whole main.js module
     graph finished loading: on a cold cache / slow tunnel the popup showed the
     FULL stand UI for seconds (author-reported「独立窗口打开，打开的是整个
     stand」), and any boot crash before that line left the full shell up for
     good. Classic script = runs before first paint and before the module graph:
     (a) tag <html> so the shell-hide rules in split.css apply from frame zero;
     (b) normalize a legacy /index.html deep link onto the canonical app URL "/"
         (same query preserved) so the alias route can never BE the URL of an
         independent window — the popout chain targets "/" exclusively. */
  try {
    var __nfQ = new URLSearchParams(location.search);
    if (__nfQ.get('card-window') === '1') {
      document.documentElement.classList.add('card-window-boot');
      if (location.pathname === '/index.html') {
        history.replaceState(null, '', '/' + location.search);
      }
    }
  } catch (_) { /* no-history environment: canvas.js boot leg still applies */ }
  </script>

  <script>
  (function () {
    var root = document.documentElement;
    try {
      // 内嵌脸（沙箱 HTML 预览防递归体系）不进门：main.js 在 DOMContentLoaded
      // 自渲染停止面，门会把body藏起来连停止面一起吞。卡窗脸进门——其壳隐藏
      // 规则也在 CSS 里，CSS 失败时卡窗同样会裸整壳，门是它在模块图跑起来之前
      // 唯一的遮羞面（卡窗静态看门狗只管模块图挂起，不管 CSS 失败）。
      if (root.dataset.nfEmbedded === '1') return;
      root.classList.add('nf-boot-gate');

      var links = Array.prototype.slice.call(
        document.querySelectorAll('head link[rel~="stylesheet"]')
      );
      var done = false;
      // 与卡窗静态看门狗同档预算：判定「永远到不了」，不是性能超时。
      var WATCHDOG_MS = 15000;
      var watchdog = null;

      // ── 入场卡（接管/入场同族批 2026-11-01 作者令③）────────────────────────
      // 进控制台的加载期整面同族卡片 + 真实加载项清单（作者令：进度走真实加载项
      // 不是假进度条，就绪才揭幕）。四项：css（本门脚本自己的三态判定）/ ui（
      // main.js 模块图+壳装配完成）/ host（ws.js 首次握手成功；握手被拒 = fail 腿
      // 立即揭幕让位给登录/重连面）/ data（首帧 configData 落地）。信号源在
      // ws.js / main.js，经 window.__nfEntry.mark 回报——本脚本零请求依赖不变，
      // API 先于一切模块存在，回报点只做 typeof 防御。
      // 卡窗脸不进延长门（其就绪语义不同、自带静态看门狗）：CSS 窗落定即摘门，
      // 行为与接管批之前逐字一致。
      var isCardWindow = root.classList.contains('card-window-boot');
      var failedHard = false; // CSS 失败面已落（fail()）：一票否决入场揭幕——裸渲染批
                              // 「任一样式失败 ⇒ 永不摘门」的铁律不被 fail 腿击穿
                              //（CSS 全断时模块图仍会跑、ws 仍会握手被拒）。
      var entry = {
        order: ['css', 'ui', 'host', 'data'],
        states: {},     // id -> 'pending'|'active'|'done'|'fail'
        armed: false,   // 入场面已建（DOMContentLoaded 后）
        revealed: false,
        watchdog: null
      };
      var dataGrace = null; // 数据宽限定时器（见 maybeReveal）
      // 面文案随既存 locale 偏好（品牌命名空间键优先，nebflow_ 旧拼法回退——
      // modal.js 顶部经典脚本同款读法）。
      var loc = 'zh-CN';
      try {
        var lb = (window.__BRAND__ && window.__BRAND__.lowerName) || 'nebflow';
        loc = localStorage.getItem(lb + '_locale') || localStorage.getItem('nebflow_locale') || 'zh-CN';
      } catch (e) { /* 存储不可用：中文缺省 */ }
      var zh = String(loc).indexOf('zh') === 0;
      var T = zh ? {
        cardTitle: '正在进入控制台',
        ready: '就绪',
        items: {
          css:  ['样式表', '正在准备样式…'],
          ui:   ['界面模块', '正在装载界面…'],
          host: ['连接主机', '正在检查主机…'],
          data: ['同步数据', '正在同步数据…']
        }
      } : {
        cardTitle: 'Entering console',
        ready: 'Ready',
        items: {
          css:  ['Styles', 'Preparing styles…'],
          ui:   ['Interface', 'Loading interface…'],
          host: ['Checking host', 'Checking host…'],
          data: ['Syncing data', 'Syncing data…']
        }
      };

      function entryRows() {
        var face = document.getElementById('nf-boot-gate');
        if (!face) return null;
        var items = face.querySelector('.nf-entry-items');
        var title = face.querySelector('.nf-entry-title');
        if (!items || !title) return null;
        return { face: face, items: items, title: title };
      }

      function paintEntry() {
        var el = entryRows();
        if (!el) return;
        // 活动项 = 顺序面上第一个未完成项；标题跟随它的动作文案（「正在检查主机…」
        // 即入场族同名位的出处），全部完成 = 就绪。活动行 data-state=active
        // （与样式表的 active 强调位同源——先行项之后仍未到的行保持 pending）。
        var active = null;
        for (var i = 0; i < entry.order.length; i++) {
          var id = entry.order[i];
          var st = entry.states[id] || 'pending';
          var row = el.items.querySelector('[data-item="' + id + '"]');
          if (!active && st !== 'done' && st !== 'fail') { active = id; st = 'active'; }
          if (row) row.setAttribute('data-state', st);
        }
        el.title.textContent = active ? T.items[active][1] : T.ready;
      }

      function buildEntryFace() {
        if (entry.revealed) return; // 揭幕先到（如握手在 DCL 前被拒）：面已收走，零补画零看门狗
        var el = entryRows();
        if (!el) return;
        el.face.setAttribute('data-entry', 'on');
        el.title.textContent = T.cardTitle;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < entry.order.length; i++) {
          var id = entry.order[i];
          var row = document.createElement('div');
          row.className = 'nf-entry-item';
          row.setAttribute('data-item', id);
          row.setAttribute('data-state', 'pending');
          var dot = document.createElement('span');
          dot.className = 'nf-entry-dot';
          dot.setAttribute('aria-hidden', 'true');
          var label = document.createElement('span');
          label.className = 'nf-entry-label';
          label.textContent = T.items[id][0];
          row.appendChild(dot);
          row.appendChild(label);
          frag.appendChild(row);
        }
        el.items.appendChild(frag);
        entry.armed = true;
        paintEntry();
        // 安全阀：入场项 20s 仍未齐（TCP 黑洞/挂死握手形状）——揭幕让位给应用
        // 自身的活性面（conn-banner/登录门），绝不无限期扣住入口。
        entry.watchdog = setTimeout(function () { reveal(true); }, 20000);
      }

      function reveal(fade) {
        if (entry.revealed || failedHard) return;
        entry.revealed = true;
        if (entry.watchdog !== null) { clearTimeout(entry.watchdog); entry.watchdog = null; }
        if (dataGrace !== null) { clearTimeout(dataGrace); dataGrace = null; }
        var face = document.getElementById('nf-boot-gate');
        var finish = function () {
          root.classList.remove('nf-boot-gate');
          root.classList.remove('nf-boot-reveal');
          if (face) face.style.display = 'none';
        };
        if (fade && face) {
          // crossfade：body 先行可见（揭的是已就绪/已让位的壳），门面淡出后收走。
          face.setAttribute('data-state', 'ready');
          root.classList.add('nf-boot-reveal');
          setTimeout(finish, 260);
        } else finish();
      }

      function maybeReveal() {
        if (entry.revealed || !entry.armed) return;
        var missing = [];
        for (var i = 0; i < entry.order.length; i++) {
          if (entry.states[entry.order[i]] !== 'done') missing.push(entry.order[i]);
        }
        if (!missing.length) { reveal(true); return; }
        // 数据宽限（css/ui/host 齐、唯 data 未到）：3s 有界等待后让位——真实引擎
        // 在 connect 即推 configData（生产形态零感知）；替身/病态服务端不扣入口。
        if (missing.length === 1 && missing[0] === 'data' && dataGrace === null) {
          dataGrace = setTimeout(function () { dataGrace = null; reveal(true); }, 3000);
        }
      }

      function markEntry(id, state) {
        if (entry.revealed || failedHard) return; // 已揭幕 / CSS 失败面：迟到回报零副作用
        if (entry.order.indexOf(id) < 0) return;
        entry.states[id] = state;
        try { (window.__nfEntryState = window.__nfEntryState || {})[id] = state; } catch (e) { /* 永不抛 */ }
        paintEntry();
        // fail 腿（host 握手被拒 = 入场无法继续）：立即揭幕让位给登录/重连面。
        if (state === 'fail' && id !== 'css') reveal(true);
        else maybeReveal();
      }

      // 信号回报单缝（ws.js / main.js 消费点只做 typeof 防御调用）。
      window.__nfEntry = { mark: markEntry };

      // 三态判定（逐链终态性自知）：本脚本被**script-blocking 表**（媒体条件
      // 命中或无媒体条件的 render-blocking 表）阻塞——执行到此处时这类表必已
      // 终态（成功/失败），其 sheet 缺席 = 网络失败类（abort/断流：error 事件
      // 在本脚本挂监听**之前**就 fire 完毕，此判据是唯一收口），0 规则 = 404/
      // 空体（本树 CSS 均非空，0 规则即失败语义）。非适用媒体表（highlight
      // 双主题对）不阻塞脚本、可能仍在途——缺席按 pending，其 load/error 事件
      // 驱动复评；已处理即足（适用性由媒体查询决定，与规则数无关）。看门狗
      // 兜底一切挂死。
      function isScriptBlocking(link) {
        var m = link.getAttribute('media');
        if (!m || !window.matchMedia) return true;
        try { return window.matchMedia(m).matches; } catch (e) { return true; }
      }
      function classify(link) {
        var sheet = link.sheet;
        if (!sheet) return isScriptBlocking(link) ? 'fail' : 'pending';
        if (!isScriptBlocking(link)) return 'ok';
        // CSSOM：加载失败的表 cssRules 访问抛 SecurityError（同源前提下 throw
        // 即失败语义）；0 规则 = 404/空体（本树 CSS 均非空）。
        try { return sheet.cssRules.length > 0 ? 'ok' : 'fail'; }
        catch (e) { return 'fail'; }
      }

      function cleanup() {
        document.removeEventListener('load', onRes, true);
        document.removeEventListener('error', onRes, true);
        if (watchdog !== null) { clearTimeout(watchdog); watchdog = null; }
      }

      // CSS 窗落定（全 ok）——接管/入场同族批改语义：主脸不再就地摘门，转入场
      // 延长门（清单四项全 done 才揭幕）；卡窗脸保持现行为（就地摘门）。原「摘门」
      // 职责收进 reveal()/本函数，失败路径（fail → 失败面、永不揭幕）逐字不变。
      function lift() {
        if (done) return;
        done = true;
        cleanup();
        if (isCardWindow) {
          // 卡窗脸：就绪语义不同（canvas.js 自带引导态面 + 静态看门狗），CSS 窗
          // 即门——接管批之前的行为逐字保留（同任务 add+lift，零闪现不受入场卡影响）。
          root.classList.remove('nf-boot-gate');
          return;
        }
        markEntry('css', 'done');
        // 面元素在 body 首元素——CSS 窗落定可能先于 body 解析完成，两拍收口：
        // 已解析即建面，否则挂 DOMContentLoaded（此窗内信号先到的，建面后补画）。
        if (document.getElementById('nf-boot-gate')) buildEntryFace();
        else document.addEventListener('DOMContentLoaded', buildEntryFace, { once: true });
      }

      function fail() {
        if (done) return;
        done = true;
        failedHard = true; // 一票否决入场揭幕（见上）——失败面永在，绝不回落裸壳
        window.__nfBootGateFailed = true; // 卡窗静态看门狗去重锚（下方）
        cleanup();
        // error 可在 body 解析完成前到达（首帧前失败）——面元素在 body 首元素，
        // 未解析则挂 DOMContentLoaded 补画；门类保持（body 维持隐藏）。
        if (document.getElementById('nf-boot-gate')) showFailedFace();
        else document.addEventListener('DOMContentLoaded', showFailedFace, { once: true });
      }

      function showFailedFace() {
        var face = document.getElementById('nf-boot-gate');
        if (!face) return;
        face.setAttribute('data-state', 'failed');
        var card = face.querySelector('.nf-boot-card');
        if (!card) return;
        var title = card.querySelector('.nf-boot-card-title');
        var hint = card.querySelector('.nf-boot-card-hint');
        var retry = card.querySelector('.nf-boot-retry');
        var bypass = card.querySelector('.nf-boot-retry-bypass');
        if (title) title.textContent = '页面样式加载失败 / Styles failed to load';
        if (hint) hint.textContent = '部分样式资源未能到达（网络中断或缓存过期），重试即可恢复。Some stylesheets never arrived — retry to reload.';
        if (retry) {
          retry.textContent = '重试 / Retry';
          retry.addEventListener('click', function () {
            try { location.reload(); } catch (e) { /* 永不抛 */ }
          });
        }
        if (bypass) {
          bypass.textContent = '绕过缓存重试 / Retry without cache';
          bypass.addEventListener('click', function () {
            try {
              var u = new URL(location.href);
              u.searchParams.set('nfsw', '0'); // sw.js 逃生门：query 其余原样保留
              location.replace(u.toString());
            } catch (e) { location.reload(); }
          });
        }
        card.hidden = false;
      }

      function evaluate() {
        if (done) return;
        var ok = 0;
        for (var i = 0; i < links.length; i++) {
          var c = classify(links[i]);
          if (c === 'fail') { fail(); return; }
          if (c === 'ok') ok++;
        }
        if (ok === links.length) lift();
      }

      // load/error 在 link 上不冒泡——捕获阶段挂在 document 上收。error 即判死
      // （样式加载失败的定义本身），不等 sheet 态；load 走常规三态复评。
      function onRes(evt) {
        var t = evt.target;
        if (!t || t.tagName !== 'LINK') return;
        var rel = ' ' + (t.getAttribute('rel') || '') + ' ';
        if (rel.indexOf(' stylesheet ') < 0) return;
        if (evt.type === 'error') { fail(); return; }
        evaluate();
      }

      document.addEventListener('load', onRes, true);
      document.addEventListener('error', onRes, true);
      watchdog = setTimeout(function () {
        if (done) return;
        fail(); // 到点仍有未决样式 ⇒ 失败面收口，绝不回落裸壳
      }, WATCHDOG_MS);

      evaluate(); // 初始评：缓存即中 ⇒ 首帧前摘门，加载面零闪现
    } catch (e) {
      // 门自身故障 ⇒ 放行回现状行为（面只在 html.nf-boot-gate 下可见，自隐）。
      try { root.classList.remove('nf-boot-gate'); } catch (_) { /* 永不抛 */ }
    }
  })();
  </script>
</head>
<body>

       噪声 + 克制 scale（5）：折射集中在边缘、按钮文字零畸变。消费 =

  /* Pre-paint Side Bar panel restore (classic script — runs before the module
     graph). The body class was set at parse start; here we resolve the
     persisted active panel so the FIRST FRAME already shows the correct
     panel/button state (no flicker). Unknown persisted ids fall back to
     'files'. Collapsed → nothing is active (activityBar.js re-activates the
     stored panel on expand). */
  (function () {
    var r = window.__sidebarRestore || { collapsed: false, panel: 'files' };
    var panels = document.querySelectorAll('#sidebar-panel .panel');
    var target = null;
    for (var i = 0; i < panels.length; i++) {
      if (panels[i].getAttribute('data-panel-id') === r.panel) target = panels[i];
    }
    if (!target) target = document.querySelector('#sidebar-panel .panel[data-panel-id="files"]');
    for (var j = 0; j < panels.length; j++) {
      panels[j].classList.toggle('active', !r.collapsed && panels[j] === target);
    }
    var pid = target ? target.getAttribute('data-panel-id') : 'files';
    var btn = document.querySelector('#activity-bar [data-panel-btn="' + pid + '"]');
    if (btn) {
      btn.classList.toggle('active', !r.collapsed);
      btn.setAttribute('aria-pressed', r.collapsed ? 'false' : 'true');
    }
  })();

  <!-- 卡窗静态引导看门狗（独立窗口本机加速批 2026-10-29）。诊断失地：模块图
       （main.js 及其 import 图）挂起/失败时 —— 拥塞隧道上模块 fetch 停摆、SW
       陈旧索引引用已不存在的历史版本资产（404）—— canvas.js 的引导态面自身
       也在模块图里 ⇒ 谁都不会报错，独立窗只剩 index 静态壳的空标题胶囊
       （作者 11:06 截证形态）。本看门狗是**零模块依赖**的最后观察者：经典脚本
       只认 DOM 事实 —— html.card-window-boot 在场而 body.card-window 迟迟不
       现（initCardWindowMode 未跑）且无引导态面 ⇒ 判「引导未启动」，注入可见
       失败卡 + [重试]；重试带 ?nfsw=0 绕过 SW（陈旧索引形态的自愈出口）。
       引导成功（body.card-window 现身）即永久哑火，零运行时面。 -->
  <script>
  (function () {
    try {
      if (!document.documentElement.classList.contains('card-window-boot')) return;
      var CARDWIN_BOOT_WATCHDOG_MS = 15000;
      setTimeout(function () {
        try {
          if (document.body.classList.contains('card-window')) return;   // 引导已启动
          if (window.__nfBootGateFailed) return; // 裸渲染批：引导门已出样式失败面，不重复报告
          if (document.getElementById('nf-cardwin-boot')) return;        // canvas.js 引导态面在场
          var pane = document.querySelector('#canvas-content .canvas-tab-pane');
          if (pane && pane.childElementCount > 0) return;                // 真容已挂
          var card = document.createElement('div');
          card.id = 'nf-cardwin-static-watchdog';
          card.setAttribute('data-state', 'failed');
          card.style.cssText =
            'position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:60;' +
            'display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 34px;' +
            'border:1px solid #e0e1e4;border-radius:14px;background:#fff;color:#1b1e26;' +
            "font:13px/1.7 -apple-system,'Segoe UI',sans-serif;text-align:center;max-width:78vw;" +
            'box-shadow:0 2px 14px rgba(0,0,0,.08)';
          var head = document.createElement('div');
          head.style.cssText = 'font-weight:600;font-size:14px';
          head.textContent = '独立窗口加载失败';
          var hint = document.createElement('div');
          hint.style.cssText = 'color:#6a737d;font-size:12px;max-width:340px;word-break:break-word';
          hint.textContent = '页面资源未能完成加载（网络拥塞或缓存版本过期）。点击重试将绕过缓存重新载入。';
          var retry = document.createElement('button');
          retry.style.cssText =
            'margin-top:2px;padding:6px 18px;border-radius:8px;cursor:pointer;' +
            'border:1px solid #d8d9dd;background:transparent;color:inherit;font-size:12px';
          retry.textContent = '重试';
          retry.addEventListener('click', function () {
            try {
              var q = new URLSearchParams(location.search);
              q.set('nfsw', '0');   // sw.js 逃生门：绕过 SW（陈旧索引形态自愈）
              location.replace(location.pathname + '?' + q.toString());
            } catch (_) { location.reload(); }
          });
          card.append(head, hint, retry);
          document.body.appendChild(card);
        } catch (_) { /* 看门狗自身永不抛 */ }
      }, CARDWIN_BOOT_WATCHDOG_MS);
    } catch (_) { /* 无 DOM 形态（测试壳）静默 */ }
  })();
  </script>
  <!-- 手机交互层注册钩子：桌面视口只做一次 media-query 判定即返回（不 import
       控制器、不建 DOM）；手机视口动态加载 js/mobile/ 四控制器（nav/layout/
       gestures/floats，r2 规格①②③⑤）。 -->
  <script type="module" src="js/mobile/bootstrap.js"></script>
