<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>nebflow</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="vendor/highlight-github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="vendor/highlight-github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/taskList.css">
  <link rel="stylesheet" href="css/reminder.css">
  <link rel="stylesheet" href="css/neblink.css">
  <link rel="stylesheet" href="css/dropbox.css">
  <link rel="stylesheet" href="css/sapphire.css">
  <link rel="stylesheet" href="css/split.css">
  <link rel="stylesheet" href="css/voice.css">
  <link rel="stylesheet" href="css/planMode.css">
</head>
<body>
  <script>document.documentElement.classList.add('ui-init');</script>
  <script>if(localStorage.getItem('nebflow_sidebar_collapsed')==='true')document.body.classList.add('sidebar-collapsed');</script>
  <!-- Activity Bar — vertical icon strip (independent glass card).
       Top: avatar (tap to log in to NebLink). Bottom: settings.
       Device management lives in the Settings panel (NebLink section). -->
  <div id="activity-bar">
    <button id="activity-avatar" class="activity-avatar" title="Login">
      <img class="activity-avatar-logo" src="logo.svg" alt="">
      <img class="activity-avatar-photo" alt="" hidden>
      <span class="activity-avatar-letter" hidden>N</span>
    </button>
    <div class="activity-spacer"></div>
    <button id="settings-btn" class="activity-btn" title="Settings"><i data-lucide="settings"></i></button>
  </div>

  <!-- Sidebar — file explorer -->
  <div id="sidebar">
    <div id="sidebar-panel">
      <div id="panel-sessions" class="panel active">
        <!-- Sidebar top bar — empty drag handle for panel reordering -->
        <div class="sidebar-topbar"></div>

        <!-- Explorer Section -->
        <div id="explorer-section">
          <div class="explorer-header">
            <span class="explorer-title">Explorer</span>
            <div class="explorer-actions">
              <button class="explorer-action-btn" id="explorer-new-file-btn" title="New File">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6"/><path d="M9 15h6"/></svg>
              </button>
              <button class="explorer-action-btn" id="explorer-new-folder-btn" title="New Folder">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>
              </button>
              <button id="explorer-folder-btn" class="explorer-folder-btn" title="Open Folder">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
              </button>
            </div>
          </div>
          <div id="explorer-tree">
            <!-- File tree rendered here by explorer.js -->
          </div>
        </div>
      </div>
      <div id="panel-settings" class="panel">
        <div class="panel-header">
          <span class="panel-title">Settings</span>
          <div class="panel-actions">
            <button id="settings-back-btn" class="panel-btn" title="Back"><i data-lucide="arrow-left"></i></button>
          </div>
        </div>
        <div id="settings-content"></div>
      </div>
    </div>
  </div>

  <!-- Column resizer — drag to adjust sidebar / main widths -->
  <div class="col-resizer" data-left="sidebar" data-right="main"></div>

  <!-- Main Chat Area -->
  <div id="main">
    <div id="header">
      <div class="header-left">
        <button id="sidebar-toggle" class="sidebar-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span id="header-model-info"></span>
      </div>
      <div class="header-center">
        <span id="session-name"></span>
        <button id="memory-btn" class="memory-btn" title="Memory" hidden><i data-lucide="brain"></i></button>
      </div>
      <div class="header-right">
        <div id="bypass-dropdown" class="header-dropdown">
          <button id="bypass-toggle" class="bypass-toggle" data-mode="confirm-edits" title="安全模式">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </button>
        </div>
        <button class="voice-toggle" id="voice-toggle-btn" title="Voice output">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button id="reminder-btn" title="Scheduled Tasks"><i data-lucide="clock"></i></button>
        <div id="bg-indicator" class="hidden">
          <span class="bg-dot"></span>
          <span class="bg-count">0</span>
        </div>
        <div id="delegate-indicator" class="hidden" title="Sub-agents running">
          <span class="delegate-dot"></span>
          <span class="delegate-count">0</span>
        </div>
        <button id="flow-toggle-btn" class="flow-toggle-btn" title="Toggle team visualization">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><path d="M6 7v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/><path d="M12 11v6"/></svg>
        </button>
      </div>
    </div>
    <!-- Dropdowns moved outside #header so backdrop-filter can blur chat content.
         #header has its own backdrop-filter which creates a backdrop root, preventing
         child elements from blurring content behind the header. -->
    <div class="header-dropdown-menu" id="bypass-menu">
      <button data-mode="confirm-edits">确认编辑</button>
      <button data-mode="auto-edits">编辑放行</button>
      <button data-mode="auto-all">全部放行</button>
    </div>
    <div id="delegate-dropdown" class="hidden">
      <div class="bg-dropdown-header">Sub-agents</div>
      <div class="bg-dropdown-list"></div>
    </div>
    <div id="bg-dropdown" class="hidden">
      <div class="bg-dropdown-header">Background tasks</div>
      <div class="bg-dropdown-list"></div>
    </div>
    <!-- Reminder Panel — floating dropdown from header button -->
    <div id="reminder-panel">
      <div class="reminder-panel-header">
        <div class="reminder-panel-title">Scheduled Tasks</div>
        <div class="reminder-panel-header-right">
          <span class="reminder-panel-count"></span>
          <button class="reminder-create-btn" id="reminder-create-btn" title="New Task">
            <i data-lucide="plus"></i>
          </button>
        </div>
      </div>
      <div class="reminder-panel-body"></div>
      <div class="reminder-panel-footer"></div>
    </div>
    <div id="top-overlays">
      <div id="task-list"></div>
      <div id="notification-banner"></div>
    </div>
    <div id="chat"></div>
    <div id="status-wrap">
      <div id="lottie-spinner"></div>
      <span id="status-text"></span>
    </div>
    <div id="input-area">
      <div class="voice-overlay" id="voice-overlay">
        <div class="voice-wave"><i data-lucide="mic"></i></div>
        <div class="voice-text" id="voice-text">Listening...</div>
        <div class="voice-hint" id="voice-hint">Release to send</div>
      </div>
      <!-- Moved outside #input-bar so backdrop-filter can blur chat content -->
      <div id="slash-dropdown"></div>
      <div id="queue-bar"></div>
      <div id="input-bar">
        <button class="icon-btn" id="voice-btn" title="Voice input"><i data-lucide="mic"></i></button>
      <div id="input-wrap" style="position:relative;">
        <div id="attachment-preview"></div>
        <div id="ask-indicator"><span id="ask-indicator-label">ASK</span><span id="ask-indicator-cancel">&times;</span></div>
        <div id="skill-indicator"><span id="skill-indicator-label">SKILL</span><span id="skill-indicator-cancel">&times;</span></div>
        <div id="compact-indicator"><span id="compact-indicator-label">COMPACT</span><span id="compact-indicator-cancel">&times;</span></div>
        <div id="plan-indicator"><span id="plan-indicator-label">PLAN</span><span id="plan-indicator-cancel">&times;</span></div>
        <textarea id="input" rows="1" placeholder="Type a message..." autocomplete="off"></textarea>
      </div>
      <button class="icon-btn" id="attach-btn"><i data-lucide="paperclip"></i></button>
      <button id="send-btn"><i data-lucide="send"></i></button>
      <button id="stop-btn"><i data-lucide="square"></i></button>
    </div>
  </div>
  </div>

  <!-- Column resizer — drag to adjust main / canvas widths (only when canvas open) -->
  <div class="col-resizer" data-left="main" data-right="canvas"></div>

  <!-- Canvas Panel — generic display container (画板) -->
  <div id="canvas-panel">
    <div id="canvas-slide">
      <div class="canvas-header">
        <div class="canvas-tab-bar" id="canvas-tab-bar"></div>
        <button id="canvas-close-btn" class="canvas-close-btn" title="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="canvas-content"></div>
    </div>
  </div>

  <!-- Right edge bar — thin fixed strip anchoring the canvas panel's right boundary -->
  <div class="edge-bar edge-bar-right"></div>

  <!-- Modals -->
  <div id="modal-overlay">
    <div id="modal-box">
      <div id="modal-title">New Session</div>
      <input id="modal-input" type="text" placeholder="Session name" autocomplete="off">
      <div id="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">Create</button>
      </div>
    </div>
    <div id="delete-box">
      <div id="delete-title">Delete Session</div>
      <div id="delete-msg"></div>
      <div id="delete-actions">
        <button id="delete-cancel">Cancel</button>
        <button id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>
  <!-- Agent Editor Modal (separate overlay) -->
  <div id="agent-overlay">
    <div id="agent-modal">
      <div id="agent-modal-title">Edit Agent</div>
      <div id="agent-modal-body">
        <div class="agent-field-label">Tools</div>
        <div id="agent-tools-grid"></div>
        <div class="agent-field-label" data-i18n="agent.systemPrompt">System Prompt</div>
        <textarea id="agent-system-input" placeholder="System prompt (Markdown)" rows="12" spellcheck="false"></textarea>
      </div>
      <div id="agent-modal-actions">
        <button id="agent-modal-cancel">Cancel</button>
        <button id="agent-modal-save">Save</button>
      </div>
    </div>
  </div>
  <!-- Memory Editor Modal (three tabs: Folder / Agent / User) -->
  <div id="memory-overlay">
    <div id="memory-modal">
      <div id="memory-modal-title">Memory</div>
      <div class="memory-tabs">
        <button class="memory-tab active" data-scope="agent">Agent</button>
        <button class="memory-tab" data-scope="user">User</button>
      </div>
      <div id="memory-modal-body">
        <textarea id="memory-content-input" placeholder="# Memory&#10;&#10;Key facts, decisions, context..." rows="12" spellcheck="false"></textarea>
      </div>
      <div id="memory-modal-actions">
        <button id="memory-modal-cancel">Cancel</button>
        <button id="memory-modal-save">Save</button>
      </div>
    </div>
  </div>
  <!-- Card Design Editor Modal -->
  <div id="card-design-overlay">
    <div id="card-design-modal">
      <div id="card-design-modal-title">Card Design</div>
      <div id="card-design-modal-body">
        <textarea id="card-design-input" placeholder="Card visual design guidelines (Markdown)" rows="20" spellcheck="false"></textarea>
      </div>
      <div id="card-design-modal-actions">
        <button id="card-design-modal-reset">Reset to Default</button>
        <button id="card-design-modal-cancel">Cancel</button>
        <button id="card-design-modal-save">Save</button>
      </div>
    </div>
  </div>
  <!-- Rules Editor Modal -->
  <div id="rules-overlay">
    <div id="rules-modal">
      <div id="rules-modal-title">Project Rules</div>
      <div id="rules-modal-body">
        <textarea id="rules-input" placeholder="" rows="14" spellcheck="false"></textarea>
      </div>
      <div id="rules-modal-actions">
        <button id="rules-modal-delete" style="display:none;margin-right:auto"></button>
        <button id="rules-modal-cancel">Cancel</button>
        <button id="rules-modal-save">Save</button>
      </div>
    </div>
  </div>
  <!-- Project Root Picker Modal -->
  <div id="path-picker-overlay">
    <div id="path-picker-modal">
      <div id="path-picker-title">Set Project Directory</div>
      <div id="path-picker-breadcrumb"></div>
      <div id="path-picker-list"></div>
      <div id="path-picker-actions">
        <button id="path-picker-cancel">Cancel</button>
        <button id="path-picker-clear">Clear</button>
        <button id="path-picker-select">Select This Folder</button>
      </div>
    </div>
  </div>
  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/lottie.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
