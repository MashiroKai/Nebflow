<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6 5" shape-rendering="crispEdges">
  <!-- Nebflow 6x5 pixel icon: black border, green accent, white pattern -->
  <!-- Row 0: all black -->
  <rect x="0" y="0" width="6" height="1" fill="#000000"/>
  <!-- Row 1 -->
  <rect x="0" y="1" width="1" height="1" fill="#000000"/>
  <rect x="1" y="1" width="1" height="1" fill="#4CAF50"/>
  <rect x="2" y="1" width="1" height="1" fill="#000000"/>
  <rect x="3" y="1" width="2" height="1" fill="#ffffff"/>
  <rect x="5" y="1" width="1" height="1" fill="#000000"/>
  <!-- Row 2 -->
  <rect x="0" y="2" width="2" height="1" fill="#000000"/>
  <rect x="2" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="3" y="2" width="1" height="1" fill="#000000"/>
  <rect x="4" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="5" y="2" width="1" height="1" fill="#000000"/>
  <!-- Row 3 -->
  <rect x="0" y="3" width="2" height="1" fill="#000000"/>
  <rect x="2" y="3" width="1" height="1" fill="#ffffff"/>
  <rect x="3" y="3" width="1" height="1" fill="#000000"/>
  <rect x="4" y="3" width="1" height="1" fill="#ffffff"/>
  <rect x="5" y="3" width="1" height="1" fill="#000000"/>
  <!-- Row 4: all black -->
  <rect x="0" y="4" width="6" height="1" fill="#000000"/>
</svg>
