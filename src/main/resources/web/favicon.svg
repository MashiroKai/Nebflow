<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3" shape-rendering="crispEdges">
  <!-- Nebflow pixel icon: 4x3, dark bg + light/green pixels -->
  <rect width="4" height="3" rx="0.5" fill="#1e1e32"/>
  <!-- Row 0 -->
  <rect x="0" y="0" width="1" height="1" fill="#e0e0e0"/>
  <rect x="1" y="0" width="1" height="1" fill="#e0e0e0"/>
  <!-- Row 1 -->
  <rect x="0" y="1" width="1" height="1" fill="#e0e0e0"/>
  <rect x="2" y="1" width="1" height="1" fill="#22B14C"/>
  <rect x="3" y="1" width="1" height="1" fill="#22B14C"/>
  <!-- Row 2 -->
  <rect x="0" y="2" width="1" height="1" fill="#e0e0e0"/>
  <rect x="2" y="2" width="1" height="1" fill="#22B14C"/>
</svg>
